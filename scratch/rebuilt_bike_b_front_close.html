<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Rebuilt Biker & Mudguards Verification</title>
  <style>
    body { margin: 0; background: #0c1220; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <script src="../assets/three.min.js"></script>
  <script>
    // Cached Textures
    let _cachedSidewallTexture = null;
    function getSportTireSidewallTexture() {
      if (_cachedSidewallTexture) return _cachedSidewallTexture;
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#16181b';
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = '#22252a';
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.arc(256, 256, 240, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(256, 256, 218, -Math.PI * 0.42, -Math.PI * 0.08);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(256, 256, 218, Math.PI * 0.58, Math.PI * 0.92);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.save();
      ctx.translate(256, 256);
      ctx.rotate(-Math.PI * 0.25);
      ctx.fillText('DIABLO ROSSO', 0, -188);
      ctx.restore();

      ctx.save();
      ctx.translate(256, 256);
      ctx.rotate(Math.PI * 0.75);
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('200/55 ZR17', 0, -188);
      ctx.restore();

      ctx.strokeStyle = '#2a2d32';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(256, 256, 160, 0, Math.PI * 2);
      ctx.stroke();

      _cachedSidewallTexture = new THREE.CanvasTexture(canvas);
      _cachedSidewallTexture.wrapS = THREE.ClampToEdgeWrapping;
      _cachedSidewallTexture.wrapT = THREE.ClampToEdgeWrapping;
      return _cachedSidewallTexture;
    }

    let _cachedRotorTexture = null;
    function getDiscRotorTexture() {
      if (_cachedRotorTexture) return _cachedRotorTexture;
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 256, 256);

      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.arc(128, 128, 120, 0, Math.PI * 2);
      ctx.arc(128, 128, 68, 0, Math.PI * 2, true);
      ctx.fill();

      ctx.fillStyle = '#1e293b';
      for (let r = 80; r <= 112; r += 9) {
        const count = Math.floor(r * 0.45);
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 + (r * 0.1);
          const x = 128 + Math.cos(angle) * r;
          const y = 128 + Math.sin(angle) * r;
          ctx.beginPath();
          ctx.arc(x, y, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      _cachedRotorTexture = new THREE.CanvasTexture(canvas);
      return _cachedRotorTexture;
    }

    // Lofting along X axis for fuel tank, seat, and fenders
    function createLoftedBodyMesh(stations, radSegs, mat) {
      radSegs = radSegs || 24;
      const numStations = stations.length;
      const pos = [];
      const uvs = [];
      const indices = [];

      for (let s = 0; s < numStations; s++) {
        const st = stations[s];
        const u = s / (numStations - 1);
        const ryTop = st.ryTop !== undefined ? st.ryTop : (st.ry !== undefined ? st.ry : 1.0);
        const ryBot = st.ryBot !== undefined ? st.ryBot : (st.ry !== undefined ? st.ry : 1.0);
        const rz = st.rz !== undefined ? st.rz : 1.0;

        for (let j = 0; j <= radSegs; j++) {
          const theta = (j / radSegs) * Math.PI * 2;
          const cosT = Math.cos(theta);
          const sinT = Math.sin(theta);
          const ry = cosT >= 0 ? ryTop : ryBot;
          const y = st.center[1] + cosT * ry;
          const z = st.center[2] + sinT * rz;
          const x = st.center[0];

          pos.push(x, y, z);
          uvs.push(j / radSegs, u);
        }
      }

      for (let s = 0; s < numStations - 1; s++) {
        for (let j = 0; j < radSegs; j++) {
          const a = s * (radSegs + 1) + j;
          const b = (s + 1) * (radSegs + 1) + j;
          const c = (s + 1) * (radSegs + 1) + j + 1;
          const d = s * (radSegs + 1) + j + 1;
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // Lofting along Y axis for anatomical V-tapered Torso
    function createLoftedTorsoMesh(stations, radSegs, mat) {
      radSegs = radSegs || 24;
      const numStations = stations.length;
      const pos = [];
      const uvs = [];
      const indices = [];

      for (let s = 0; s < numStations; s++) {
        const st = stations[s];
        const v = s / (numStations - 1);
        const rxFront = st.rxFront !== undefined ? st.rxFront : (st.rx !== undefined ? st.rx : 0.8);
        const rxBack = st.rxBack !== undefined ? st.rxBack : (st.rx !== undefined ? st.rx : 0.8);
        const rz = st.rz !== undefined ? st.rz : 1.0;

        for (let j = 0; j <= radSegs; j++) {
          const theta = (j / radSegs) * Math.PI * 2;
          const cosT = Math.cos(theta); // in X (front/back)
          const sinT = Math.sin(theta); // in Z (left/right)
          const rx = cosT >= 0 ? rxFront : rxBack;
          const x = st.center[0] + cosT * rx;
          const y = st.center[1];
          const z = st.center[2] + sinT * rz;

          pos.push(x, y, z);
          uvs.push(j / radSegs, v);
        }
      }

      for (let s = 0; s < numStations - 1; s++) {
        for (let j = 0; j < radSegs; j++) {
          const a = s * (radSegs + 1) + j;
          const b = (s + 1) * (radSegs + 1) + j;
          const c = (s + 1) * (radSegs + 1) + j + 1;
          const d = s * (radSegs + 1) + j + 1;
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // Continuous Spline Lofted Limb (Natural Organic Anatomy, Zero Mannequin Disconnects)
    function createSeamlessLoftedLimb(crossSections, radialSegs, pathSegs, material) {
      radialSegs = radialSegs || 14;
      pathSegs = pathSegs || 18;

      const points = crossSections.map(c => new THREE.Vector3(c.p[0], c.p[1], c.p[2]));
      const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5);

      function getInterpolatedRadius(u) {
        const n = crossSections.length - 1;
        const idx = Math.min(Math.floor(u * n), n - 1);
        const t = (u * n) - idx;
        const cA = crossSections[idx];
        const cB = crossSections[idx + 1];
        return {
          rx: THREE.MathUtils.lerp(cA.rx, cB.rx, t),
          ry: THREE.MathUtils.lerp(cA.ry || cA.rx, cB.ry || cB.rx, t)
        };
      }

      const frames = curve.computeFrenetFrames(pathSegs, false);
      const vertices = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= pathSegs; i++) {
        const u = i / pathSegs;
        const P = curve.getPointAt(u);
        const rad = getInterpolatedRadius(u);
        const N = frames.normals[i];
        const B = frames.binormals[i];

        for (let j = 0; j <= radialSegs; j++) {
          const v = j / radialSegs;
          const theta = v * Math.PI * 2;
          const cos = Math.cos(theta);
          const sin = Math.sin(theta);

          const vx = P.x + (N.x * cos * rad.rx) + (B.x * sin * rad.ry);
          const vy = P.y + (N.y * cos * rad.rx) + (B.y * sin * rad.ry);
          const vz = P.z + (N.z * cos * rad.rx) + (B.z * sin * rad.ry);

          vertices.push(vx, vy, vz);
          uvs.push(u, v);
        }
      }

      for (let i = 0; i < pathSegs; i++) {
        for (let j = 0; j < radialSegs; j++) {
          const a = i * (radialSegs + 1) + j;
          const b = (i + 1) * (radialSegs + 1) + j;
          const c = (i + 1) * (radialSegs + 1) + (j + 1);
          const d = i * (radialSegs + 1) + (j + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();

      const mesh = new THREE.Mesh(geo, material);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // Precise Mathematical Arch Fender with Contoured Crown Profile
    function createArchFender(cx, cy, r, width, startDeg, endDeg, segs, mat) {
      segs = segs || 24;
      const geo = new THREE.BufferGeometry();
      const pos = [];
      const uvs = [];
      const indices = [];
      const halfW = width / 2;

      // 3 lateral vertices per cross-section: left edge, center crown, right edge
      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const deg = startDeg + t * (endDeg - startDeg);
        const rad = deg * Math.PI / 180;
        const cosR = Math.cos(rad);
        const sinR = Math.sin(rad);

        // Center crown
        const xC = cx + cosR * r;
        const yC = cy + sinR * r;
        // Edge dropped slightly by 0.08 for natural curved fender lip
        const xE = cx + cosR * (r - 0.08);
        const yE = cy + sinR * (r - 0.08);

        pos.push(xE, yE, -halfW); // 0
        uvs.push(0, t);
        pos.push(xC, yC, 0);      // 1
        uvs.push(0.5, t);
        pos.push(xE, yE, halfW);  // 2
        uvs.push(1, t);
      }

      for (let i = 0; i < segs; i++) {
        const row0 = i * 3;
        const row1 = (i + 1) * 3;
        // Left flank
        indices.push(row0, row1, row0 + 1);
        indices.push(row0 + 1, row1, row1 + 1);
        // Right flank
        indices.push(row0 + 1, row1 + 1, row0 + 2);
        indices.push(row0 + 2, row1 + 1, row1 + 2);

        // Double sided
        indices.push(row0, row0 + 1, row1);
        indices.push(row0 + 1, row1 + 1, row1);
        indices.push(row0 + 1, row0 + 2, row1 + 1);
        indices.push(row0 + 2, row1 + 2, row1 + 1);
      }

      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      return mesh;
    }

    // Shared Materials
    const rubberMat = new THREE.MeshStandardMaterial({ color: 0x16181b, roughness: 0.90 });
    const darkFrameMat = new THREE.MeshStandardMaterial({ color: 0x181a1d, roughness: 0.45, metalness: 0.50 });
    const chromeMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.22, metalness: 0.82 });
    const gunmetalEngineMat = new THREE.MeshStandardMaterial({ color: 0x22252a, roughness: 0.38, metalness: 0.65 });
    const bronzeCoverMat = new THREE.MeshStandardMaterial({ color: 0x78563a, roughness: 0.30, metalness: 0.60 });
    const goldAnodizedMat = new THREE.MeshStandardMaterial({ color: 0xd4a024, roughness: 0.22, metalness: 0.82 });
    const darkLeatherMat = new THREE.MeshStandardMaterial({ color: 0x181a1d, roughness: 0.75, metalness: 0.05 });
    const discRotorMat = new THREE.MeshStandardMaterial({ map: getDiscRotorTexture(), roughness: 0.25, metalness: 0.85, transparent: true });

    const pearlWhiteMat = new THREE.MeshStandardMaterial({ color: 0xf5f6fa, roughness: 0.18, metalness: 0.15 });
    const matteBlackKneeMat = new THREE.MeshStandardMaterial({ color: 0x1e2124, roughness: 0.85 });
    const smokedVisorMat = new THREE.MeshStandardMaterial({ color: 0x0a0f1d, roughness: 0.10, metalness: 0.20, transparent: true, opacity: 0.80 });

    const glossyBlackMat = new THREE.MeshStandardMaterial({ color: 0x0f1115, roughness: 0.15, metalness: 0.30 });
    const crimsonPinstripeMat = new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.35, metalness: 0.20 });
    const redRimStripeMat = new THREE.MeshStandardMaterial({ color: 0xd63031, roughness: 0.30, metalness: 0.10 });

    function createSportWheel(radius, width, isRear, isModelA) {
      const wheel = new THREE.Group();
      const rimRadius = radius * 0.70;

      const tire = new THREE.Mesh(new THREE.TorusGeometry(radius - width * 0.42, width * 0.42, 18, 36), rubberMat);
      wheel.add(tire);

      if (isModelA) {
        [-1, 1].forEach(side => {
          const sidewallGeo = new THREE.RingGeometry(rimRadius * 0.98, radius * 0.98, 32);
          const sidewallMat = new THREE.MeshBasicMaterial({ map: getSportTireSidewallTexture(), transparent: true, side: THREE.DoubleSide });
          const sidewall = new THREE.Mesh(sidewallGeo, sidewallMat);
          sidewall.position.z = side * (width * 0.43);
          wheel.add(sidewall);
        });
      } else {
        [-1, 1].forEach(side => {
          const rimStripe = new THREE.Mesh(new THREE.TorusGeometry(rimRadius + 0.08, 0.07, 8, 36), redRimStripeMat);
          rimStripe.position.z = side * (width * 0.38);
          wheel.add(rimStripe);
        });
      }

      // Clean dark billet hub (ZERO stray tan blocks)
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.25, radius * 0.25, width * 0.85, 18), darkFrameMat);
      hub.rotation.x = Math.PI / 2;
      wheel.add(hub);

      // 5-spoke billet rim (clean darkFrameMat for both models)
      for (let i = 0; i < 5; i++) {
        const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.32, rimRadius * 0.92, width * 0.32), darkFrameMat);
        spoke.rotation.z = (i / 5) * Math.PI * 2;
        spoke.position.set(Math.sin((i / 5) * Math.PI * 2) * (rimRadius * 0.46), Math.cos((i / 5) * Math.PI * 2) * (rimRadius * 0.46), 0);
        wheel.add(spoke);
      }

      const disc = new THREE.Mesh(new THREE.RingGeometry(radius * 0.24, radius * 0.62, 32), discRotorMat);
      disc.position.z = isRear ? -width * 0.36 : width * 0.36;
      wheel.add(disc);

      return wheel;
    }

    // =========================================================================
    // REBUILT 3D BIKER HUMAN ANATOMY BUILDER (CONTINUOUS ORGANIC SPLINES)
    // =========================================================================
    function buildRealisticBiker(isCruiser, saddlePos, gripLeft, gripRight, pegLeft, pegRight) {
      const biker = new THREE.Group();

      // Distinct Outfits
      let jacketHex, pantsHex, bootHex, helmetHex, helmetAccentHex;
      if (isCruiser) {
        // Black Cruiser Rider
        jacketHex = 0x1e242b; // Fitted charcoal-black biker jacket
        pantsHex = 0x1e293b;  // Dark indigo jeans
        bootHex = 0x121417;   // Black combat/riding boots
        helmetHex = 0x111317; // Matte-black helmet
        helmetAccentHex = 0x334155;
      } else {
        // White Streetfighter Rider
        jacketHex = 0x3d4f49; // Olive-slate armored riding jacket
        pantsHex = 0x2b4c7e;  // Dark blue denim jeans
        bootHex = 0x261c14;   // Dark brown/black ankle riding boots
        helmetHex = 0x0f172a; // Glossy black with white accents
        helmetAccentHex = 0xf5f6fa;
      }

      const jacketMat = new THREE.MeshStandardMaterial({ color: jacketHex, roughness: 0.78, metalness: 0.08 });
      const pantsMat = new THREE.MeshStandardMaterial({ color: pantsHex, roughness: 0.85, metalness: 0.04 });
      const bootMat = new THREE.MeshStandardMaterial({ color: bootHex, roughness: 0.60, metalness: 0.12 });
      const soleMat = new THREE.MeshStandardMaterial({ color: 0x0d0e12, roughness: 0.90 });
      const gloveMat = new THREE.MeshStandardMaterial({ color: 0x181a1d, roughness: 0.65, metalness: 0.15 });
      const helmetMat = new THREE.MeshStandardMaterial({ color: helmetHex, roughness: isCruiser ? 0.85 : 0.25, metalness: 0.35 });
      const visorMat = new THREE.MeshStandardMaterial({ color: 0x050811, roughness: 0.04, metalness: 0.95 });

      // 1. SCULPTED PELVIS & GLUTES SEATED SQUARELY ON SADDLE (ZERO GAP BEHIND RIDER)
      // Glutes sit squarely on the saddle bucket
      const pelvisGroup = new THREE.Group();
      const glutesY = isCruiser ? saddlePos[1] + 0.45 : saddlePos[1] + 0.30;
      pelvisGroup.position.set(saddlePos[0], glutesY, saddlePos[2]);

      // Rounded pelvis & glutes ellipsoid filling saddle curve
      const glutesMesh = new THREE.Mesh(new THREE.SphereGeometry(1.05, 24, 18), pantsMat);
      glutesMesh.scale.set(1.25, 0.85, 1.15);
      pelvisGroup.add(glutesMesh);

      // Lower back / lumbar waist bridge (fills seat backrest seam)
      const lumbarMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 0.98, 0.90, 18), pantsMat);
      lumbarMesh.position.set(-0.25, 0.45, 0);
      lumbarMesh.rotation.z = isCruiser ? -0.15 : -0.32;
      pelvisGroup.add(lumbarMesh);

      biker.add(pelvisGroup);

      // 2. ANATOMICAL V-TAPERED JACKET TORSO (LOFTED IN 3D WITH REAL VOLUME)
      // Leaned forward toward handlebars (~28° on streetfighter, ~15° on cruiser)
      const leanAngle = isCruiser ? -0.24 : -0.48; // Radians
      const torsoGroup = new THREE.Group();
      torsoGroup.position.set(saddlePos[0] + 0.10, glutesY + 0.55, saddlePos[2]);
      torsoGroup.rotation.z = leanAngle;

      // 3D V-tapered jacket stations lofted along Y (Waist -> Ribs -> Broad Chest -> Shoulder Plane)
      const torsoStations = [
        { center: [0.0, 0.0, 0],   rxFront: 0.75, rxBack: 0.68, rz: 1.05 }, // Waist
        { center: [0.0, 1.3, 0],   rxFront: 0.90, rxBack: 0.78, rz: 1.25 }, // Mid-torso
        { center: [0.0, 2.7, 0],   rxFront: 1.15, rxBack: 0.85, rz: 1.48 }, // Broad athletic chest
        { center: [0.0, 3.8, 0],   rxFront: 0.85, rxBack: 0.75, rz: 1.35 }  // Shoulder plane
      ];
      torsoGroup.add(createLoftedTorsoMesh(torsoStations, 24, jacketMat));

      // Clavicle & Upper Chest Dome (Seals the top of the jacket completely)
      const clavicleCap = new THREE.Mesh(new THREE.SphereGeometry(1.25, 20, 14), jacketMat);
      clavicleCap.scale.set(0.65, 0.35, 1.05);
      clavicleCap.position.set(0, 3.75, 0);
      torsoGroup.add(clavicleCap);

      // Fitted jacket high collar
      const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.62, 0.48, 20), jacketMat);
      collar.position.set(0, 4.05, 0);
      torsoGroup.add(collar);

      biker.add(torsoGroup);

      // Compute world shoulder positions below collarbone (INSIDE upper outer corners of jacket torso)
      const shLocalL = new THREE.Vector3(0.0, 3.45, -1.25);
      const shLocalR = new THREE.Vector3(0.0, 3.45, 1.25);
      shLocalL.applyEuler(new THREE.Euler(0, 0, leanAngle)).add(torsoGroup.position);
      shLocalR.applyEuler(new THREE.Euler(0, 0, leanAngle)).add(torsoGroup.position);

      // Deltoid shoulder caps flush inside jacket
      [shLocalL, shLocalR].forEach(shPos => {
        const deltoid = new THREE.Mesh(new THREE.SphereGeometry(0.48, 16, 14), jacketMat);
        deltoid.position.copy(shPos);
        biker.add(deltoid);
      });

      // 3. CONTINUOUS LOFTED SPLINE ARMS & MOTORCYCLE RIDING GLOVES
      [[-1, shLocalL, gripLeft], [1, shLocalR, gripRight]].forEach(([side, shPos, gripPos]) => {
        const sx = shPos.x;
        const sy = shPos.y;
        const sz = shPos.z;
        const gx = gripPos[0];
        const gy = gripPos[1];
        const gz = gripPos[2];

        // Natural elbow point with ~22° bend, flared slightly outward
        const elbowX = sx + (gx - sx) * 0.48;
        const elbowY = sy + (gy - sy) * 0.42 - 0.40;
        const elbowZ = side * (Math.abs(sz) + 0.32);

        // Mid-bicep
        const bicepX = sx + (elbowX - sx) * 0.50;
        const bicepY = sy + (elbowY - sy) * 0.50;
        const bicepZ = sz + (elbowZ - sz) * 0.50;

        // Wrist position
        const wristX = gx - 0.20;
        const wristY = gy - 0.08;
        const wristZ = gz;

        // Mid-forearm
        const midForeX = elbowX + (wristX - elbowX) * 0.50;
        const midForeY = elbowY + (wristY - elbowY) * 0.50;
        const midForeZ = elbowZ + (wristZ - elbowZ) * 0.50;

        // Seamless continuous lofted arm (Shoulder -> Bicep -> Elbow -> Forearm -> Wrist)
        const armSections = [
          { p: [sx, sy, sz], rx: 0.36, ry: 0.36 },
          { p: [bicepX, bicepY, bicepZ], rx: 0.33, ry: 0.33 },
          { p: [elbowX, elbowY, elbowZ], rx: 0.28, ry: 0.28 },
          { p: [midForeX, midForeY, midForeZ], rx: 0.25, ry: 0.25 },
          { p: [wristX, wristY, wristZ], rx: 0.21, ry: 0.21 }
        ];
        biker.add(createSeamlessLoftedLimb(armSections, 14, 16, jacketMat));

        // Sculpted Motorcycle Riding Glove gripping handlebar
        const handGroup = new THREE.Group();
        handGroup.position.set(gx, gy, gz);

        // Palm & armored back protector
        const palm = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.36, 0.42), gloveMat);
        handGroup.add(palm);

        // Curled fingers wrapped around grip
        const fingers = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.40, 14), gloveMat);
        fingers.rotation.x = Math.PI / 2;
        fingers.position.set(0.15, -0.06, 0);
        handGroup.add(fingers);

        // Lever (clutch / brake)
        const lever = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.90, 8), chromeMat);
        lever.rotation.x = Math.PI / 2 + (side * 0.12);
        lever.position.set(0.32, 0.04, -side * 0.22);
        handGroup.add(lever);

        biker.add(handGroup);
      });

      // 4. CONTINUOUS LOFTED SPLINE LEGS & RIDING BOOTS (HUGGING TANK)
      [[-1, pegLeft], [1, pegRight]].forEach(([side, pegPos]) => {
        const hipX = saddlePos[0] + 0.35;
        const hipY = glutesY + 0.15;
        const hipZ = side * 0.82;

        const px = pegPos[0];
        const py = pegPos[1];
        const pz = pegPos[2];

        // Knee hugging fuel tank tightly
        let kneeX, kneeY, kneeZ;
        if (isCruiser) {
          kneeX = hipX + 1.85;
          kneeY = hipY - 0.22;
          kneeZ = side * 1.15;
        } else {
          kneeX = hipX + 1.65;
          kneeY = hipY - 0.38;
          kneeZ = side * 1.15;
        }

        // Mid-thigh hugging tank contour
        const midThighX = hipX + (kneeX - hipX) * 0.50;
        const midThighY = hipY + (kneeY - hipY) * 0.50;
        const midThighZ = hipZ + (kneeZ - hipZ) * 0.50;

        // Ankle point entering boot shaft
        const ankleX = px;
        const ankleY = py + 0.45;
        const ankleZ = pz;

        // Mid-calf
        const midCalfX = kneeX + (ankleX - kneeX) * 0.50;
        const midCalfY = kneeY + (ankleY - kneeY) * 0.50;
        const midCalfZ = kneeZ + (ankleZ - kneeZ) * 0.50;

        // Seamless continuous lofted leg (Hip -> Thigh -> Knee -> Shin -> Ankle)
        const legSections = [
          { p: [hipX, hipY, hipZ], rx: 0.48, ry: 0.48 },
          { p: [midThighX, midThighY, midThighZ], rx: 0.43, ry: 0.43 },
          { p: [kneeX, kneeY, kneeZ], rx: 0.38, ry: 0.38 },
          { p: [midCalfX, midCalfY, midCalfZ], rx: 0.34, ry: 0.32 },
          { p: [ankleX, ankleY, ankleZ], rx: 0.26, ry: 0.26 }
        ];
        biker.add(createSeamlessLoftedLimb(legSections, 14, 18, pantsMat));

        // Dark molded knee armor contour
        const kneePad = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 10), gloveMat);
        kneePad.scale.set(0.48, 0.88, 0.78);
        kneePad.position.set(kneeX + 0.20, kneeY, kneeZ);
        biker.add(kneePad);

        // Sculpted Motorcycle Riding Boot on footpeg
        const bootGroup = new THREE.Group();
        bootGroup.position.set(px, py, pz);
        if (isCruiser) bootGroup.rotation.z = 0.25;

        // Ankle shaft
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.26, 0.65, 14), bootMat);
        shaft.position.set(0, 0.32, 0);
        bootGroup.add(shaft);

        // Sole
        const sole = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.18, 0.68), soleMat);
        sole.position.set(0.30, 0.09, 0);
        bootGroup.add(sole);

        // Upper boot body
        const upper = new THREE.Mesh(new THREE.BoxGeometry(1.10, 0.42, 0.64), bootMat);
        upper.position.set(0.12, 0.32, 0);
        bootGroup.add(upper);

        // Reinforced toe cap
        const toe = new THREE.Mesh(new THREE.BoxGeometry(0.60, 0.32, 0.62), bootMat);
        toe.position.set(0.68, 0.25, 0);
        bootGroup.add(toe);

        biker.add(bootGroup);
      });

      // 5. PROPORTIONATE FULL-FACE MOTORCYCLE HELMET (+30% LARGER, 1.30X SCALE)
      // Neck seal connecting cleanly into jacket collar
      const neckLocal = new THREE.Vector3(0, 4.35, 0);
      neckLocal.applyEuler(new THREE.Euler(0, 0, leanAngle)).add(torsoGroup.position);

      const neckSeal = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.50, 0.55, 20), gloveMat);
      neckSeal.position.copy(neckLocal);
      neckSeal.rotation.z = leanAngle;
      biker.add(neckSeal);

      const headPos = new THREE.Vector3(0, 4.90, 0);
      headPos.applyEuler(new THREE.Euler(0, 0, leanAngle)).add(torsoGroup.position);

      const helmetGroup = new THREE.Group();
      helmetGroup.position.copy(headPos);
      helmetGroup.rotation.z = isCruiser ? -0.05 : -0.16; // Leveled riding sightline

      // 1.30x Scale Full-Face Helmet Shell (Elongated aerodynamic oval)
      const helmetShell = new THREE.Mesh(new THREE.SphereGeometry(1.12, 36, 28), helmetMat);
      helmetShell.scale.set(1.20, 1.15, 1.02);
      helmetShell.position.set(-0.06, 0.05, 0);
      helmetGroup.add(helmetShell);

      // White/Silver Accent Graphic Stripes (on Streetfighter)
      if (!isCruiser) {
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.12, 0.22), new THREE.MeshStandardMaterial({ color: 0xf5f6fa, roughness: 0.20 }));
        stripe.position.set(-0.08, 0.95, 0);
        stripe.rotation.z = -0.15;
        helmetGroup.add(stripe);
      }

      // Full-face chin guard bar
      const chinGuard = new THREE.Mesh(new THREE.CylinderGeometry(1.08, 1.00, 0.55, 28, 1, false, -Math.PI * 0.36, Math.PI * 0.72), helmetMat);
      chinGuard.scale.set(1.16, 1.0, 1.0);
      chinGuard.position.set(0.20, -0.32, 0);
      helmetGroup.add(chinGuard);

      // Curved tinted full-face shield visor wrapping across eye port
      const visor = new THREE.Mesh(new THREE.CylinderGeometry(1.12, 1.08, 0.56, 28, 1, true, -Math.PI * 0.36, Math.PI * 0.72), visorMat);
      visor.scale.set(1.18, 1.0, 1.0);
      visor.position.set(0.22, 0.12, 0);
      helmetGroup.add(visor);

      // Rear aerodynamic spoiler lip (on streetfighter)
      if (!isCruiser) {
        const spoiler = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.10, 1.15), helmetMat);
        spoiler.position.set(-1.12, 0.22, 0);
        spoiler.rotation.z = -0.32;
        helmetGroup.add(spoiler);
      }

      biker.add(helmetGroup);

      return biker;
    }

      hlGroup.add(hlBezel);

      const hlLens = new THREE.Mesh(new THREE.CircleGeometry(0.92, 24), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfffbeb, emissiveIntensity: 0.95, roughness: 0.08 }));
      hlLens.rotation.y = Math.PI / 2;
      hlLens.position.set(0.26, 0, 0);
      hlGroup.add(hlLens);

      const flyscreenShape = new THREE.Shape();
      flyscreenShape.moveTo(0, 0);
      flyscreenShape.quadraticCurveTo(0.4, 1.8, 0.1, 2.8);
      flyscreenShape.quadraticCurveTo(-0.6, 2.2, -0.5, 0);
      flyscreenShape.closePath();
      const flyscreen = new THREE.Mesh(new THREE.ExtrudeGeometry(flyscreenShape, { depth: 1.4, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.05 }).translate(0, 0, -0.7), smokedVisorMat);
      flyscreen.position.set(-0.25, 0.7, 0);
      flyscreen.rotation.z = -0.45;
      hlGroup.add(flyscreen);
      bike.add(hlGroup);

      // Wide Flat Chrome T-Bars
      const tBar = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 5.2, 14), chromeMat);
      tBar.rotation.x = Math.PI / 2;
      tBar.position.set(tripleTreeX + 0.10, tripleTreeY + 0.65, 0);
      bike.add(tBar);

      const gripLeft = [tripleTreeX + 0.10, tripleTreeY + 0.65, -2.25];
      const gripRight = [tripleTreeX + 0.10, tripleTreeY + 0.65, 2.25];

      [-2.45, 2.45].forEach(mz => {
        const mStem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.75, 8), chromeMat);
        mStem.position.set(tripleTreeX + 0.10, tripleTreeY + 1.05, mz);
        bike.add(mStem);
        const mHead = new THREE.Mesh(new THREE.CylinderGeometry(0.40, 0.40, 0.08, 16), chromeMat);
        mHead.rotation.z = Math.PI / 2;
        mHead.position.set(tripleTreeX + 0.10, tripleTreeY + 1.45, mz);
        bike.add(mHead);
      });

      // Double-Cradle Black Steel Frame
      const cradleTubes = [
        [[tripleTreeX - 0.4, tripleTreeY - 0.6, 1.0], [3.8, 4.2, 1.3], [1.8, 2.3, 1.3], [-2.0, 2.3, 1.3], [-4.2, 3.8, 1.1]],
        [[tripleTreeX - 0.4, tripleTreeY - 0.6, -1.0], [3.8, 4.2, -1.3], [1.8, 2.3, -1.3], [-2.0, 2.3, -1.3], [-4.2, 3.8, -1.1]]
      ];
      cradleTubes.forEach(pts => {
        const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])));
        const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 16, 0.20, 8, false), darkFrameMat);
        bike.add(tube);
      });

      // Exposed Chrome V-Twin Engine
      const vTwinGroup = new THREE.Group();
      vTwinGroup.position.set(1.2, 4.5, 0);

      const crankCase = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2.4, 2.2), gunmetalEngineMat);
      vTwinGroup.add(crankCase);

      const vAngles = [-0.40, 0.40];
      vAngles.forEach(va => {
        const cylGroup = new THREE.Group();
        cylGroup.rotation.z = va;
        cylGroup.position.set(Math.sin(va) * 0.9, Math.cos(va) * 0.9, 0);

        for (let fy = 0; fy <= 1.8; fy += 0.28) {
          const cFin = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.07, 18), darkFrameMat);
          cFin.position.y = fy;
          cylGroup.add(cFin);
          const iFin = new THREE.Mesh(new THREE.CylinderGeometry(0.82, 0.82, 0.22, 16), gunmetalEngineMat);
          iFin.position.y = fy + 0.14;
          cylGroup.add(iFin);
        }

        vTwinGroup.add(cylGroup);

        const rockerHead = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.55, 1.6), chromeMat);
        rockerHead.rotation.z = va;
        rockerHead.position.set(Math.sin(va) * 2.8, Math.cos(va) * 2.8, 0);
        vTwinGroup.add(rockerHead);

        [-0.55, 0.55].forEach(pz => {
          const pushRod = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.2, 8), chromeMat);
          pushRod.rotation.z = va * 1.08;
          pushRod.position.set(Math.sin(va) * 1.35, Math.cos(va) * 1.35, pz * 1.05);
          vTwinGroup.add(pushRod);
        });
      });

      const airCleaner = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.32, 20), chromeMat);
      airCleaner.rotation.x = Math.PI / 2;
      airCleaner.position.set(0.0, 1.3, 1.32);
      vTwinGroup.add(airCleaner);

      const primaryCover = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.35, 20), chromeMat);
      primaryCover.rotation.x = Math.PI / 2;
      primaryCover.position.set(0.2, -0.2, 1.25);
      vTwinGroup.add(primaryCover);
      bike.add(vTwinGroup);

      // Dual Staggered Chrome Exhaust Pipes
      [0.95, 1.30].forEach((pz, idx) => {
        const pipeY = 2.7 + idx * 0.45;
        const pipePts = [
          new THREE.Vector3(2.4, 4.4 - idx * 0.4, 0.6),
          new THREE.Vector3(3.0, 3.4, pz),
          new THREE.Vector3(1.8, pipeY, pz),
          new THREE.Vector3(-4.0, pipeY, pz),
          new THREE.Vector3(-8.8 - idx * 0.4, pipeY, pz)
        ];
        const pipeCurve = new THREE.CatmullRomCurve3(pipePts);
        const exPipe = new THREE.Mesh(new THREE.TubeGeometry(pipeCurve, 20, 0.22, 10, false), chromeMat);
        bike.add(exPipe);

        const slashTip = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.65, 14), chromeMat);
        slashTip.rotation.z = Math.PI / 2 - 0.35;
        slashTip.position.set(-8.8 - idx * 0.4, pipeY, pz);
        bike.add(slashTip);
      });

      // Teardrop Glossy Black Fuel Tank with Crimson Pinstripes
      const cruiserTankStations = [
        { center: [5.4, 7.5, 0],  ryTop: 0.50, ryBot: 0.65, rz: 0.65 },
        { center: [4.0, 8.4, 0],  ryTop: 1.20, ryBot: 1.45, rz: 1.40 },
        { center: [2.2, 8.2, 0],  ryTop: 1.15, ryBot: 1.35, rz: 1.30 },
        { center: [0.2, 7.3, 0],  ryTop: 0.90, ryBot: 1.10, rz: 1.05 },
        { center: [-1.4, 6.4, 0], ryTop: 0.50, ryBot: 0.65, rz: 0.72 }
      ];
      bike.add(createLoftedBodyMesh(cruiserTankStations, 24, glossyBlackMat));

      // Low-profile flush billet gas cap (ZERO vertical grey bar)
      const gasCap = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.10, 18), chromeMat);
      gasCap.position.set(3.2, 8.85, 0);
      gasCap.rotation.z = -0.25;
      bike.add(gasCap);

      [-1.38, 1.38].forEach(tz => {
        const pinstripeCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(-1.2, 6.5, tz * 0.7),
          new THREE.Vector3(0.4, 7.5, tz * 0.95),
          new THREE.Vector3(2.2, 8.6, tz * 1.05),
          new THREE.Vector3(4.0, 8.7, tz * 1.05),
          new THREE.Vector3(5.2, 7.7, tz * 0.6)
        ]);
        const stripeTube = new THREE.Mesh(new THREE.TubeGeometry(pinstripeCurve, 20, 0.05, 8, false), crimsonPinstripeMat);
        bike.add(stripeTube);
      });

      // Ultra-Low Scooped Leather Saddle
      const seatStations = [
        { center: [-1.4, 6.2, 0], ryTop: 0.38, ryBot: 0.40, rz: 0.90 },
        { center: [-2.8, 5.4, 0], ryTop: 0.35, ryBot: 0.38, rz: 1.05 },
        { center: [-4.2, 5.7, 0], ryTop: 0.38, ryBot: 0.35, rz: 0.95 },
        { center: [-5.4, 6.4, 0], ryTop: 0.42, ryBot: 0.32, rz: 0.80 }
      ];
      bike.add(createLoftedBodyMesh(seatStations, 20, darkLeatherMat));

      // Swept Full-Coverage Rear Bobber Fender
      const fenderStations = [
        { center: [-4.3, 6.08, 0], ryTop: 0.16, ryBot: 0.14, rz: 1.12 },
        { center: [-5.6, 6.35, 0], ryTop: 0.18, ryBot: 0.16, rz: 1.22 },
        { center: [-7.2, 6.55, 0], ryTop: 0.20, ryBot: 0.18, rz: 1.25 },
        { center: [-8.8, 6.50, 0], ryTop: 0.20, ryBot: 0.18, rz: 1.22 },
        { center: [-10.4, 5.75, 0], ryTop: 0.18, ryBot: 0.16, rz: 1.18 },
        { center: [-11.5, 4.40, 0], ryTop: 0.16, ryBot: 0.14, rz: 1.10 }
      ];
      bike.add(createLoftedBodyMesh(fenderStations, 24, glossyBlackMat));

      [-1.18, 1.18].forEach(rz => {
        const rStripeCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(-4.4, 6.12, rz * 0.75),
          new THREE.Vector3(-6.2, 6.42, rz * 0.95),
          new THREE.Vector3(-8.8, 6.56, rz * 0.98),
          new THREE.Vector3(-10.4, 5.82, rz * 0.95),
          new THREE.Vector3(-11.5, 4.45, rz * 0.80)
        ]);
        const rStripe = new THREE.Mesh(new THREE.TubeGeometry(rStripeCurve, 20, 0.05, 8, false), crimsonPinstripeMat);
        bike.add(rStripe);
      });

      const tombstoneHl = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.65, 0.45), chromeMat);
      tombstoneHl.position.set(-11.5, 4.4, 0);
      tombstoneHl.rotation.z = -0.45;
      bike.add(tombstoneHl);

      const tombstoneLens = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.45, 0.35), new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xdc2626, emissiveIntensity: 1.0 }));
      tombstoneLens.position.set(-11.68, 4.4, 0);
      tombstoneLens.rotation.z = -0.45;
      bike.add(tombstoneLens);

      [-1.12, 1.12].forEach(sz => {
        const strut = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.35, 0.22), chromeMat);
        strut.position.set(-6.8, 5.6, sz);
        strut.rotation.z = 0.18;
        bike.add(strut);
      });

      // Forward Footpegs
      const pegLeft = [2.8, 3.8, -1.55];
      const pegRight = [2.8, 3.8, 1.55];
      [-1, 1].forEach(side => {
        const peg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.85, 12), darkFrameMat);
        peg.rotation.x = Math.PI / 2;
        peg.position.set(2.8, 3.6, side * 1.55);
        bike.add(peg);
      });

      // 3. ATTACH REBUILT BIKER (Upright Cruiser Posture - Seated Deeply in Saddle)
      const saddlePos = [-2.8, 5.4, 0];
      const biker = buildRealisticBiker(true, saddlePos, gripLeft, gripRight, pegLeft, pegRight);
      bike.add(biker);

      return bike;
    }

    // Scene & Camera
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0c1220);
    const camera = new THREE.PerspectiveCamera(36, 1280 / 720, 0.1, 1000);
    camera.position.set(10, 8, 10); camera.lookAt(4, 6.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(1280, 720);
    renderer.setPixelRatio(1.5);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Studio Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
    keyLight.position.set(20, 30, 20);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x93c5fd, 1.0);
    rimLight.position.set(-20, 15, -20);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(0xfef08a, 0.4);
    fillLight.position.set(0, -10, 20);
    scene.add(fillLight);

    // Ground Plane
    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85, metalness: 0.1 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    const bike = buildCruiserModelB(); scene.add(bike);

    window.captureReady = false;
    let frames = 0;
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
      frames++;
      if (frames > 15) {
        window.captureReady = true;
      }
    }
    animate();
  </script>
</body>
</html>
