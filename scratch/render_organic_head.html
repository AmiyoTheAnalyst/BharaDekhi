<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; background: #0f172a; overflow: hidden; }
    canvas { width: 100vw; height: 100vh; display: block; }
  </style>
  <script src="../assets/three.min.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<script>
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setSize(1200, 800);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f172a);

  // Studio lighting for realistic human skin & motorcycle helmet
  const hemi = new THREE.HemisphereLight(0xffffff, 0x334155, 0.80);
  scene.add(hemi);

  const keyLight = new THREE.DirectionalLight(0xfffbeb, 1.4);
  keyLight.position.set(6, 8, 8);
  keyLight.castShadow = true;
  scene.add(keyLight);

  const fillLight = new THREE.DirectionalLight(0x94a3b8, 0.65);
  fillLight.position.set(-6, 4, -4);
  scene.add(fillLight);

  const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.9);
  rimLight.position.set(6, -2, -6);
  scene.add(rimLight);

  // Materials
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xd99872, roughness: 0.55, metalness: 0.05 });
  const darkHairMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.85 });
  const lipMat = new THREE.MeshStandardMaterial({ color: 0xb55a52, roughness: 0.45 });
  const eyeWhiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const darkIrisMat = new THREE.MeshBasicMaterial({ color: 0x1e293b });
  const pupilGlintMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const helmetMat = new THREE.MeshStandardMaterial({ color: 0xdc2626, roughness: 0.18, metalness: 0.45 });
  const linerMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.90 });
  const chromeMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.08, metalness: 0.95 });
  const visorMat = new THREE.MeshStandardMaterial({
    color: 0x0f172a,
    roughness: 0.05,
    metalness: 0.4,
    transparent: true,
    opacity: 0.40,
    side: THREE.DoubleSide,
    depthWrite: false
  });

  // Sculpted Organic Head
  function createSculptedOrganicHead(mat) {
    const nLat = 40;
    const nLon = 56;
    const positions = [];
    const normals = [];
    const uvs = [];
    const indices = [];

    for (let i = 0; i <= nLat; i++) {
      const theta = (i / nLat) * Math.PI;
      const sinT = Math.sin(theta);
      const cosT = Math.cos(theta);

      for (let j = 0; j <= nLon; j++) {
        const phi = (j / nLon) * Math.PI * 2 - Math.PI; // 0 is forward +X
        const sinP = Math.sin(phi);
        const cosP = Math.cos(phi);

        let rx = 0.78;
        let ry = 0.96;
        let rz = 0.70;
        let dr = 0.0;

        // Brow Ridge: theta ~ 0.43 * PI, phi in [-0.5, 0.5]
        const browDistT = Math.abs(theta - Math.PI * 0.43);
        const browDistP = Math.abs(phi);
        if (browDistT < 0.12 && browDistP < 0.55) {
          const factor = Math.exp(-Math.pow(browDistT / 0.08, 2) - Math.pow(browDistP / 0.40, 2));
          dr += 0.075 * factor;
        }

        // Eye Sockets: theta ~ 0.49 * PI, phi ~ +/- 0.32
        const eyeL = Math.hypot((theta - Math.PI * 0.49) / 0.08, (phi - 0.32) / 0.18);
        const eyeR = Math.hypot((theta - Math.PI * 0.49) / 0.08, (phi + 0.32) / 0.18);
        if (eyeL < 1.0) dr -= 0.085 * (1.0 - eyeL);
        if (eyeR < 1.0) dr -= 0.085 * (1.0 - eyeR);

        // Nose Bridge & Tip: theta in [0.45 * PI, 0.60 * PI], phi ~ 0
        if (theta >= Math.PI * 0.45 && theta <= Math.PI * 0.60 && Math.abs(phi) < 0.22) {
          const nFrac = (theta - Math.PI * 0.45) / (Math.PI * 0.15);
          const pFrac = Math.abs(phi) / 0.22;
          const noseHeight = 0.05 + 0.22 * Math.sin(nFrac * Math.PI);
          const noseProfile = Math.cos(pFrac * Math.PI * 0.5);
          dr += noseHeight * noseProfile;
        }

        // Cheekbones: theta ~ 0.53 * PI, phi ~ +/- 0.52
        const cheekL = Math.hypot((theta - Math.PI * 0.53) / 0.12, (phi - 0.52) / 0.25);
        const cheekR = Math.hypot((theta - Math.PI * 0.53) / 0.12, (phi + 0.52) / 0.25);
        if (cheekL < 1.0) dr += 0.065 * (1.0 - cheekL);
        if (cheekR < 1.0) dr += 0.065 * (1.0 - cheekR);

        // Lips: theta in [0.60 * PI, 0.67 * PI], phi in [-0.28, 0.28]
        if (theta >= Math.PI * 0.60 && theta <= Math.PI * 0.67 && Math.abs(phi) < 0.30) {
          const lipT = (theta - Math.PI * 0.60) / (Math.PI * 0.07);
          const lipP = Math.abs(phi) / 0.30;
          const lipShape = (Math.sin(lipT * Math.PI * 2) > 0 ? 0.06 : 0.05) * Math.sin(lipT * Math.PI) * Math.cos(lipP * Math.PI * 0.5);
          dr += lipShape;
        }

        // Defined Chin: theta in [0.69 * PI, 0.79 * PI], phi in [-0.35, 0.35]
        if (theta >= Math.PI * 0.69 && theta <= Math.PI * 0.79 && Math.abs(phi) < 0.35) {
          const chinT = (theta - Math.PI * 0.69) / (Math.PI * 0.10);
          const chinP = Math.abs(phi) / 0.35;
          dr += 0.12 * Math.sin(chinT * Math.PI) * Math.cos(chinP * Math.PI * 0.5);
        }

        // Tapering Neck: theta > 0.82 * PI
        if (theta > Math.PI * 0.82) {
          const neckFrac = (theta - Math.PI * 0.82) / (Math.PI * 0.18);
          rx *= (1.0 - neckFrac * 0.32);
          rz *= (1.0 - neckFrac * 0.22);
        }

        const totalR = 1.0 + dr;
        const x = totalR * rx * sinT * cosP;
        const y = totalR * ry * cosT;
        const z = totalR * rz * sinT * sinP;

        positions.push(x, y, z);
        normals.push(x, y, z);
        uvs.push(j / nLon, 1.0 - (i / nLat));
      }
    }

    const stride = nLon + 1;
    for (let i = 0; i < nLat; i++) {
      for (let j = 0; j < nLon; j++) {
        const a = i * stride + j;
        const b = (i + 1) * stride + j;
        const c = (i + 1) * stride + (j + 1);
        const d = i * stride + (j + 1);
        indices.push(a, b, d, b, c, d);
      }
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();

    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = true;
    return mesh;
  }

  const headGroup = new THREE.Group();

  // 1. Organic Sculpted Head Mesh
  const headMesh = createSculptedOrganicHead(skinMat);
  headGroup.add(headMesh);

  // 2. Eyebrows
  [-1, 1].forEach(side => {
    const eb = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.045, 0.22), darkHairMat);
    eb.position.set(0.66, 0.22, side * 0.22);
    eb.rotation.z = -0.08;
    eb.rotation.y = side * 0.06;
    headGroup.add(eb);
  });

  // 3. Realistic Almond Eyes
  [-1, 1].forEach(side => {
    const eyeWhite = new THREE.Mesh(new THREE.SphereGeometry(0.105, 14, 10), eyeWhiteMat);
    eyeWhite.position.set(0.58, 0.10, side * 0.22);
    headGroup.add(eyeWhite);

    const iris = new THREE.Mesh(new THREE.SphereGeometry(0.065, 12, 8), darkIrisMat);
    iris.position.set(0.66, 0.10, side * 0.22);
    headGroup.add(iris);

    const glint = new THREE.Mesh(new THREE.SphereGeometry(0.022, 6, 6), pupilGlintMat);
    glint.position.set(0.71, 0.12, side * 0.20);
    headGroup.add(glint);
  });

  // 4. Subtle Natural Lip Color Accent
  const lipTint = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 0.24), lipMat);
  lipTint.position.set(0.68, -0.22, 0);
  headGroup.add(lipTint);

  // 5. HELMET SHELL FRAMING FACE (OPEN APERTURE)
  // Crown
  const crownShape = new THREE.Shape();
  crownShape.moveTo(-0.72, 0.28);
  crownShape.quadraticCurveTo(-0.78, 1.02, 0.0, 1.04);
  crownShape.quadraticCurveTo(0.65, 1.02, 0.55, 0.35);
  crownShape.lineTo(0.42, 0.32);
  crownShape.quadraticCurveTo(0.48, 0.90, 0.0, 0.92);
  crownShape.quadraticCurveTo(-0.65, 0.90, -0.60, 0.28);
  crownShape.closePath();
  const crownGeo = new THREE.ExtrudeGeometry(crownShape, { depth: 1.02, bevelEnabled: true, bevelThickness: 0.06, bevelSize: 0.05, bevelSegments: 3 });
  crownGeo.translate(0, 0, -1.02 / 2);
  headGroup.add(new THREE.Mesh(crownGeo, helmetMat));

  // Back of Skull Cowl
  const backShape = new THREE.Shape();
  backShape.moveTo(-0.74, 0.32);
  backShape.quadraticCurveTo(-0.85, -0.22, -0.48, -0.55);
  backShape.lineTo(-0.36, -0.46);
  backShape.quadraticCurveTo(-0.70, -0.16, -0.60, 0.32);
  backShape.closePath();
  const backGeo = new THREE.ExtrudeGeometry(backShape, { depth: 0.98, bevelEnabled: true, bevelThickness: 0.05, bevelSize: 0.04, bevelSegments: 3 });
  backGeo.translate(0, 0, -0.98 / 2);
  headGroup.add(new THREE.Mesh(backGeo, helmetMat));

  // Padded Leather Liner framing brow
  const browLiner = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.92, 14), linerMat);
  browLiner.rotation.x = Math.PI / 2;
  browLiner.position.set(0.48, 0.33, 0);
  headGroup.add(browLiner);

  // Raised Translucent Tinted Visor
  const visorMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(0.92, 0.92, 0.42, 22, 1, true, -Math.PI * 0.28, Math.PI * 0.56),
    visorMat
  );
  visorMesh.rotation.z = 0.55;
  visorMesh.position.set(0.20, 0.50, 0);
  headGroup.add(visorMesh);

  // Visor Pivot Screws
  [-0.50, 0.50].forEach(pz => {
    const screw = new THREE.Mesh(new THREE.CylinderGeometry(0.065, 0.065, 0.08, 12), chromeMat);
    screw.rotation.x = Math.PI / 2;
    screw.position.set(0.14, 0.20, pz);
    headGroup.add(screw);
  });

  scene.add(headGroup);

  // Camera looking at 3/4 front view of face
  const camera = new THREE.PerspectiveCamera(35, 1200 / 800, 0.1, 100);
  camera.position.set(2.4, 0.6, 2.2);
  camera.lookAt(0.35, 0.05, 0);

  renderer.render(scene, camera);
</script>
</body>
</html>
