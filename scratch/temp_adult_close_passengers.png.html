<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dhaka Cycle Rickshaw - Master Adult Proportions</title>
  <style> body { margin: 0; background: #0b0f19; overflow: hidden; } #canvas-container { width: 100vw; height: 100vh; } </style>
</head>
<body>
<div id="canvas-container"></div>
<script src="../assets/three.min.js"></script>
<script>
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f172a);

  const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.5, 500);
  camera.position.set(-7, 11.0, 16);
  camera.lookAt(-7, 10.0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  container.appendChild(renderer.domElement);

  // Lighting
  const hemiLight = new THREE.HemisphereLight(0xe2e8f0, 0x1e293b, 0.95);
  scene.add(hemiLight);

  const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.4);
  sunLight.position.set(25, 45, -30);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 2048;
  sunLight.shadow.mapSize.height = 2048;
  scene.add(sunLight);

  const fillLight = new THREE.DirectionalLight(0x93c5fd, 0.6);
  fillLight.position.set(-20, 25, 30);
  scene.add(fillLight);

  // Road plane
  const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85 });
  const road = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), roadMat);
  road.rotation.x = -Math.PI / 2;
  road.receiveShadow = true;
  scene.add(road);

  function createBone(pA, pB, rA, rB, material) {
    const vA = new THREE.Vector3(pA[0], pA[1], pA[2]);
    const vB = new THREE.Vector3(pB[0], pB[1], pB[2]);
    const dist = vA.distanceTo(vB);
    if (dist < 0.001) return new THREE.Group();

    const segGroup = new THREE.Group();
    const cylGeo = new THREE.CylinderGeometry(rB, rA, dist, 14, 1, false);
    cylGeo.translate(0, dist / 2, 0);
    const mesh = new THREE.Mesh(cylGeo, material);
    mesh.castShadow = true;

    const jointGeo = new THREE.SphereGeometry(rA, 12, 10);
    const jointMesh = new THREE.Mesh(jointGeo, material);
    jointMesh.castShadow = true;
    segGroup.add(jointMesh);

    const dir = new THREE.Vector3().subVectors(vB, vA).normalize();
    const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    segGroup.position.copy(vA);
    segGroup.quaternion.copy(quat);
    segGroup.add(mesh);
    return segGroup;
  }

  function getRickshawArtTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 512;
    canvas.height = 512;
    const ctx = canvas.getContext('2d');

    const grad = ctx.createLinearGradient(0, 0, 512, 512);
    grad.addColorStop(0, '#0284c7');
    grad.addColorStop(0.35, '#6366f1');
    grad.addColorStop(0.7, '#ec4899');
    grad.addColorStop(1, '#f59e0b');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 512, 512);

    ctx.strokeStyle = '#fef08a';
    ctx.lineWidth = 14;
    ctx.strokeRect(12, 12, 488, 488);
    ctx.strokeStyle = '#dc2626';
    ctx.lineWidth = 6;
    ctx.strokeRect(24, 24, 464, 464);

    const scallopStep = 24;
    ctx.fillStyle = '#fef08a';
    for (let x = 20; x < 500; x += scallopStep) {
      ctx.beginPath();
      ctx.arc(x + 12, 34, 10, 0, Math.PI, false);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + 12, 478, 10, Math.PI, 0, false);
      ctx.fill();
    }

    const cx = 256, cy = 256;
    for (let i = 0; i < 8; i++) {
      const ang = (i * Math.PI * 2) / 8;
      ctx.fillStyle = i % 2 === 0 ? '#f43f5e' : '#fbbf24';
      ctx.beginPath();
      ctx.ellipse(cx + Math.cos(ang) * 90, cy + Math.sin(ang) * 90, 70, 32, ang, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cx, cy, 40, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.arc(cx, cy, 26, 0, Math.PI * 2);
    ctx.fill();

    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  function getLungiTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#264c9c'; // Rich Dhaka blue
    ctx.fillRect(0, 0, 256, 256);

    ctx.strokeStyle = '#1a3675';
    ctx.lineWidth = 3;
    for (let y = 0; y < 256; y += 32) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
    }
    for (let x = 0; x < 256; x += 32) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke();
    }

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    for (let y = 8; y < 256; y += 32) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
    }
    ctx.strokeStyle = '#60a5fa';
    ctx.lineWidth = 2;
    for (let y = 14; y < 256; y += 32) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
    }

    const tex = new THREE.CanvasTexture(canvas);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(2, 3);
    return tex;
  }

  function buildMasterRickshaw() {
    const group = new THREE.Group();

    // Standard materials
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.25, metalness: 0.85 });
    const chromeMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.15, metalness: 0.95 });
    const rubberMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.88 });
    const goldTrimMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.25, metalness: 0.7 });
    const seatRedMat = new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.45, metalness: 0.1 });
    const woodFloorMat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.75 });
    const yellowWallMat = new THREE.MeshStandardMaterial({ color: 0xf59e0b, roughness: 0.35, metalness: 0.15 });
    const tealTrimMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.35 });
    const eyeWhiteMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2 });
    const eyePupilMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.1 });
    const lipMat = new THREE.MeshStandardMaterial({ color: 0xb93b3b, roughness: 0.5 });
    const bindiMat = new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.3 });

    const hoodArtMat = new THREE.MeshStandardMaterial({
      map: getRickshawArtTexture(),
      roughness: 0.45,
      metalness: 0.08,
      side: THREE.DoubleSide
    });

    const lungiMat = new THREE.MeshStandardMaterial({
      map: getLungiTexture(),
      roughness: 0.75
    });

    function buildSpokedWheel(radius, width) {
      const wheelGroup = new THREE.Group();
      const tireGeo = new THREE.TorusGeometry(radius, width * 0.45, 14, 36);
      const tireMesh = new THREE.Mesh(tireGeo, rubberMat);
      tireMesh.castShadow = true;
      wheelGroup.add(tireMesh);

      const rimGeo = new THREE.TorusGeometry(radius * 0.92, width * 0.22, 10, 36);
      wheelGroup.add(new THREE.Mesh(rimGeo, chromeMat));

      const hubGeo = new THREE.CylinderGeometry(0.55, 0.55, width * 1.8, 14);
      hubGeo.rotateX(Math.PI / 2);
      wheelGroup.add(new THREE.Mesh(hubGeo, chromeMat));

      const spokeCount = 18;
      for (let i = 0; i < spokeCount; i++) {
        const ang = (i * Math.PI * 2) / spokeCount;
        const spokeGeo = new THREE.CylinderGeometry(0.04, 0.04, radius * 1.84, 4);
        spokeGeo.rotateZ(ang);
        wheelGroup.add(new THREE.Mesh(spokeGeo, chromeMat));
      }
      return wheelGroup;
    }

    const wheelRadius = 4.1;
    const wheelWidth = 0.55;

    // 1. Front Wheel
    const frontWheel = buildSpokedWheel(wheelRadius, wheelWidth);
    frontWheel.position.set(13.6, 4.1, 0);
    group.add(frontWheel);

    // 2. Rear Wheels
    const rearWheelL = buildSpokedWheel(wheelRadius, wheelWidth);
    rearWheelL.position.set(-10.0, 4.1, -7.5);
    group.add(rearWheelL);

    const rearWheelR = buildSpokedWheel(wheelRadius, wheelWidth);
    rearWheelR.position.set(-10.0, 4.1, 7.5);
    group.add(rearWheelR);

    group.userData.wheels = [frontWheel, rearWheelL, rearWheelR];

    // Rear Fenders
    [-7.5, 7.5].forEach(z => {
      const fenderGeo = new THREE.TorusGeometry(wheelRadius * 1.08, 0.45, 10, 24, Math.PI * 0.72);
      const fenderMesh = new THREE.Mesh(fenderGeo, yellowWallMat);
      fenderMesh.position.set(-10.0, 4.1, z);
      fenderMesh.rotation.z = Math.PI * 0.64;
      group.add(fenderMesh);
    });

    // Frame tubes
    const forkPts = [
      [-10.0, 4.1, 0], [1.6, 3.6, 0], [1.6, 3.6, 0], [0.6, 7.2, 0],
      [0.6, 7.2, 0], [8.8, 10.4, 0], [1.6, 3.6, 0], [8.8, 10.4, 0],
      [13.6, 4.1, 0], [8.8, 10.4, 0]
    ];
    for (let i = 0; i < forkPts.length; i += 2) {
      group.add(createBone(forkPts[i], forkPts[i+1], 0.28, 0.28, frameMat));
    }

    [-6.8, 6.8].forEach(z => {
      group.add(createBone([1.6, 3.6, 0], [-10.0, 4.1, z], 0.24, 0.24, frameMat));
      group.add(createBone([0.6, 7.2, 0], [-10.0, 4.1, z], 0.22, 0.22, frameMat));
    });
    group.add(createBone([-10.0, 4.1, -7.5], [-10.0, 4.1, 7.5], 0.35, 0.35, frameMat));

    // Handlebars
    const hbarPts = [
      new THREE.Vector3(6.2, 9.8, -2.6),
      new THREE.Vector3(7.4, 10.2, -1.6),
      new THREE.Vector3(8.8, 10.4, 0),
      new THREE.Vector3(7.4, 10.2, 1.6),
      new THREE.Vector3(6.2, 9.8, 2.6)
    ];
    const hbarCurve = new THREE.CatmullRomCurve3(hbarPts);
    group.add(new THREE.Mesh(new THREE.TubeGeometry(hbarCurve, 20, 0.16, 8, false), chromeMat));

    [-2.6, 2.6].forEach(gz => {
      const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 1.0, 10), rubberMat);
      grip.rotation.x = Math.PI / 2;
      grip.position.set(6.2, 9.8, gz);
      group.add(grip);
    });

    const headlamp = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.40, 0.8, 14), chromeMat);
    headlamp.rotation.z = -Math.PI / 2;
    headlamp.position.set(10.2, 9.6, 0);
    group.add(headlamp);

    const bell = new THREE.Mesh(new THREE.SphereGeometry(0.32, 10, 8), goldTrimMat);
    bell.position.set(7.6, 10.6, 1.2);
    group.add(bell);

    // Saddle
    const saddle = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.6, 1.8), rubberMat);
    saddle.position.set(0.6, 7.2, 0);
    group.add(saddle);

    // -------------------------------------------------------------------------
    // CARRIAGE TUB WITH ELEVATED ADULT BENCH & DEEP FOOTWELL
    // -------------------------------------------------------------------------
    [-1, 1].forEach(side => {
      const sideShape = new THREE.Shape();
      sideShape.moveTo(-12.8, 5.4);
      sideShape.lineTo(-3.2, 5.4);
      sideShape.lineTo(-3.2, 7.6);
      sideShape.lineTo(-6.4, 9.0);
      sideShape.lineTo(-12.8, 9.0);
      sideShape.closePath();

      const sideGeo = new THREE.ExtrudeGeometry(sideShape, {
        depth: 0.5,
        bevelEnabled: true,
        bevelSegments: 2,
        steps: 1,
        bevelSize: 0.15,
        bevelThickness: 0.15
      });
      sideGeo.translate(0, 0, side === 1 ? 6.9 : -7.4);
      const sideWall = new THREE.Mesh(sideGeo, yellowWallMat);
      sideWall.castShadow = true;
      group.add(sideWall);

      const sideRail = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.35, 0.45), goldTrimMat);
      sideRail.position.set(-8.0, 9.0, side * 7.3);
      group.add(sideRail);

      // Curved Chrome Armrest Rail
      const armPts = [
        new THREE.Vector3(-12.4, 9.2, side * 7.3),
        new THREE.Vector3(-8.2, 10.8, side * 7.3),
        new THREE.Vector3(-3.6, 8.8, side * 7.3)
      ];
      const armCurve = new THREE.CatmullRomCurve3(armPts);
      group.add(new THREE.Mesh(new THREE.TubeGeometry(armCurve, 16, 0.22, 8, false), chromeMat));
    });

    const rearWall = new THREE.Mesh(new THREE.BoxGeometry(0.5, 4.2, 14.2), yellowWallMat);
    rearWall.position.set(-12.6, 7.5, 0);
    rearWall.castShadow = true;
    group.add(rearWall);

    const carriageFloor = new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.4, 14.0), yellowWallMat);
    carriageFloor.position.set(-8.8, 5.2, 0);
    group.add(carriageFloor);

    const footboard = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.45, 14.0), woodFloorMat);
    footboard.position.set(-3.2, 5.2, 0);
    footboard.castShadow = true;
    group.add(footboard);

    const seatRiser = new THREE.Mesh(new THREE.BoxGeometry(0.4, 3.2, 13.8), yellowWallMat);
    seatRiser.position.set(-6.2, 7.0, 0);
    seatRiser.castShadow = true;
    group.add(seatRiser);

    // Bench Seat Cushion (Surface at y = 8.8)
    const benchPad = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.75, 13.8), tealTrimMat);
    benchPad.position.set(-8.8, 8.55, 0);
    benchPad.castShadow = true;
    group.add(benchPad);

    const backrest = new THREE.Mesh(new THREE.BoxGeometry(1.2, 5.8, 13.8), seatRedMat);
    backrest.position.set(-11.8, 11.4, 0);
    backrest.castShadow = true;
    group.add(backrest);

    for (let bx = -5.5; bx <= 5.5; bx += 2.75) {
      for (let by = 9.4; by <= 13.6; by += 1.4) {
        const stud = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), goldTrimMat);
        stud.position.set(-11.15, by, bx);
        group.add(stud);
      }
    }

    const backboard = new THREE.Mesh(new THREE.BoxGeometry(0.35, 7.5, 14.8), hoodArtMat);
    backboard.position.set(-12.6, 8.4, 0);
    backboard.castShadow = true;
    group.add(backboard);

    // Canopy Hood
    const canopyCenterX = -7.5;
    const canopyBaseY = 12.8;
    const canopyRx = 6.2;
    const canopyRy = 6.8;
    const canopyWidth = 8.2;

    const segs = 18;
    const posArr = [];
    const uvArr = [];
    const idxArr = [];
    for (let s = 0; s <= segs; s++) {
      const u = s / segs;
      const ang = Math.PI * (0.05 + 0.90 * u);
      const x = canopyCenterX + Math.cos(ang) * canopyRx;
      const y = canopyBaseY + Math.sin(ang) * canopyRy;
      posArr.push(x, y, -canopyWidth);
      posArr.push(x, y, canopyWidth);
      uvArr.push(u, 0);
      uvArr.push(u, 1);
      if (s < segs) {
        const v = s * 2;
        idxArr.push(v, v + 1, v + 2);
        idxArr.push(v + 1, v + 3, v + 2);
      }
    }
    const canopyGeo = new THREE.BufferGeometry();
    canopyGeo.setAttribute('position', new THREE.Float32BufferAttribute(posArr, 3));
    canopyGeo.setAttribute('uv', new THREE.Float32BufferAttribute(uvArr, 2));
    canopyGeo.setIndex(idxArr);
    canopyGeo.computeVertexNormals();

    const canopyMesh = new THREE.Mesh(canopyGeo, hoodArtMat);
    canopyMesh.castShadow = true;
    group.add(canopyMesh);

    for (let r = 0; r <= 5; r++) {
      const ru = r / 5;
      const rang = Math.PI * (0.05 + 0.90 * ru);
      const rx = canopyCenterX + Math.cos(rang) * canopyRx;
      const ry = canopyBaseY + Math.sin(rang) * canopyRy;
      const ribPts = [new THREE.Vector3(rx, ry, -canopyWidth), new THREE.Vector3(rx, ry, canopyWidth)];
      group.add(createBone(ribPts[0].toArray(), ribPts[1].toArray(), 0.16, 0.16, chromeMat));
    }

    const frontRimX = canopyCenterX + Math.cos(Math.PI * 0.05) * canopyRx;
    const frontRimY = canopyBaseY + Math.sin(Math.PI * 0.05) * canopyRy;
    const tasselCount = 13;
    for (let t = 0; t < tasselCount; t++) {
      const tz = -canopyWidth + 0.6 + (t * (canopyWidth * 2 - 1.2) / (tasselCount - 1));
      const tassel = new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.95, 6), goldTrimMat);
      tassel.rotation.z = Math.PI;
      tassel.position.set(frontRimX, frontRimY - 0.55, tz);
      group.add(tassel);
    }

    // Crankset
    const bottomBracket = [1.6, 3.6, 0];
    const crankR = 1.35;
    const crankGroup = new THREE.Group();
    crankGroup.position.set(bottomBracket[0], bottomBracket[1], bottomBracket[2]);

    const crankAxle = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 3.2, 10), chromeMat);
    crankAxle.rotation.x = Math.PI / 2;
    crankGroup.add(crankAxle);

    const chainring = new THREE.Mesh(new THREE.CylinderGeometry(1.10, 1.10, 0.12, 18), chromeMat);
    chainring.rotation.x = Math.PI / 2;
    chainring.position.z = 1.45;
    crankGroup.add(chainring);

    const crankArmL = new THREE.Mesh(new THREE.BoxGeometry(0.32, crankR, 0.18), chromeMat);
    crankArmL.position.set(0, crankR / 2, -1.55);
    crankGroup.add(crankArmL);

    const pedalLGroup = new THREE.Group();
    pedalLGroup.position.set(0, crankR, -1.55);
    const pedalLMesh = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.24, 0.65), rubberMat);
    pedalLMesh.castShadow = true;
    pedalLGroup.add(pedalLMesh);
    crankGroup.add(pedalLGroup);

    const crankArmR = new THREE.Mesh(new THREE.BoxGeometry(0.32, crankR, 0.18), chromeMat);
    crankArmR.position.set(0, -crankR / 2, 1.55);
    crankGroup.add(crankArmR);

    const pedalRGroup = new THREE.Group();
    pedalRGroup.position.set(0, -crankR, 1.55);
    const pedalRMesh = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.24, 0.65), rubberMat);
    pedalRMesh.castShadow = true;
    pedalRGroup.add(pedalRMesh);
    crankGroup.add(pedalRGroup);

    group.add(crankGroup);
    group.userData.pedalCrank = crankGroup;

    // =========================================================================
    // PARALLEL-TRANSPORT SMOOTH LOFTING FOR CONTINUOUS ORGANIC BODIES
    // =========================================================================
    function createSeamlessLoftedLimb(crossSections, radialSegs, pathSegs, material) {
      radialSegs = radialSegs || 16;
      pathSegs = pathSegs || 20;

      const points = crossSections.map(c => new THREE.Vector3(c.p[0], c.p[1], c.p[2]));
      const curve = new THREE.CatmullRomCurve3(points, false, 'catmullrom', 0.5);

      function getInterpolatedRadius(u) {
        const n = crossSections.length - 1;
        const idx = Math.min(Math.floor(u * n), n - 1);
        const t = (u * n) - idx;
        const cA = crossSections[idx];
        const cB = crossSections[idx + 1];
        return {
          rx: THREE.MathUtils.lerp(cA.rx, cB.rx, t),
          ry: THREE.MathUtils.lerp(cA.ry, cB.ry, t)
        };
      }

      const frames = curve.computeFrenetFrames(pathSegs, false);
      const vertices = [];
      const uvs = [];
      const indices = [];

      for (let i = 0; i <= pathSegs; i++) {
        const u = i / pathSegs;
        const P = curve.getPointAt(u);
        const rad = getInterpolatedRadius(u);
        const N = frames.normals[i];
        const B = frames.binormals[i];

        for (let j = 0; j <= radialSegs; j++) {
          const v = j / radialSegs;
          const theta = v * Math.PI * 2;
          const cos = Math.cos(theta);
          const sin = Math.sin(theta);

          const vx = P.x + (N.x * cos * rad.rx) + (B.x * sin * rad.ry);
          const vy = P.y + (N.y * cos * rad.rx) + (B.y * sin * rad.ry);
          const vz = P.z + (N.z * cos * rad.rx) + (B.z * sin * rad.ry);

          vertices.push(vx, vy, vz);
          uvs.push(u, v);
        }
      }

      for (let i = 0; i < pathSegs; i++) {
        for (let j = 0; j < radialSegs; j++) {
          const a = i * (radialSegs + 1) + j;
          const b = (i + 1) * (radialSegs + 1) + j;
          const c = (i + 1) * (radialSegs + 1) + (j + 1);
          const d = i * (radialSegs + 1) + (j + 1);
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, material);
      mesh.castShadow = true;
      return mesh;
    }

    function createBoneSegment(pA, pB, rA, rB, material) {
      const vA = (pA && pA.isVector3) ? pA.clone() : new THREE.Vector3(pA[0], pA[1], pA[2]);
      const vB = (pB && pB.isVector3) ? pB.clone() : new THREE.Vector3(pB[0], pB[1], pB[2]);
      const dist = vA.distanceTo(vB);
      if (dist < 0.001) return new THREE.Group();

      const segGroup = new THREE.Group();
      const cylGeo = new THREE.CylinderGeometry(rB, rA, dist, 14, 1, false);
      cylGeo.translate(0, dist / 2, 0);
      const mesh = new THREE.Mesh(cylGeo, material);
      mesh.castShadow = true;

      const jointA = new THREE.Mesh(new THREE.SphereGeometry(rA, 12, 10), material);
      jointA.castShadow = true;
      segGroup.add(jointA);

      const jointB = new THREE.Mesh(new THREE.SphereGeometry(rB, 12, 10), material);
      jointB.position.set(0, dist, 0);
      jointB.castShadow = true;
      segGroup.add(jointB);

      const kneePt = [-5.5, mHipY, legZ];
      const anklePt = [-5.3, 5.65, legZ];

      maleGroup.add(createBoneSegment(hipPt, kneePt, 0.70, 0.60, malePantMat));
      maleGroup.add(createBoneSegment(kneePt, anklePt, 0.60, 0.50, malePantMat));

      const sandal = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.24, 0.78), brownSandalMat);
      sandal.position.set(anklePt[0] + 0.4, 5.45, legZ);
      maleGroup.add(sandal);
    });

    group.add(maleGroup);

    // 2.2 FEMALE PASSENGER (Near Side / Right: z = +3.4 - HIGH-FIDELITY ORGANIC ANATOMY)
    const sareeBlouseMat = new THREE.MeshStandardMaterial({ color: 0xdf8830, roughness: 0.52 });
    const sareeSkirtMat = new THREE.MeshStandardMaterial({ color: 0x3d93b3, roughness: 0.62 });
    const sareeTrimRedMat = new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.45 });
    const femaleSkinMat = new THREE.MeshStandardMaterial({ color: 0xeec5a0, roughness: 0.60 });
    const femaleGroup = new THREE.Group();

    // Smooth Lofted Feminine Silhouette in Golden Blouse
    const femaleTorso = createSeamlessLoftedLimb([
      { p: [fHipX, fHipY, fZ], rx: 1.10, ry: 1.28 },
      { p: [fHipX + 0.10, fHipY + 1.10, fZ], rx: 0.92, ry: 1.12 },
      { p: [fHipX + 0.20, fHipY + 2.20, fZ], rx: 1.22, ry: 1.40 },
      { p: [fHipX + 0.20, fHipY + 3.30, fZ], rx: 1.10, ry: 1.55 },
      { p: [fHipX + 0.20, fHipY + 3.80, fZ], rx: 0.65, ry: 0.85 },
      { p: [fHipX + 0.20, fHipY + 4.15, fZ], rx: 0.38, ry: 0.42 }
    ], 16, 20, sareeBlouseMat);
    femaleGroup.add(femaleTorso);

    // Saree Pallu Pleats Draping Diagonally Across Bust
    const palluLoft = createSeamlessLoftedLimb([
      { p: [fHipX + 0.25, fHipY + 0.90, fZ - 0.70], rx: 0.18, ry: 0.55 },
      { p: [fHipX + 0.38, fHipY + 2.10, fZ], rx: 0.16, ry: 0.65 },
      { p: [fHipX + 0.25, fHipY + 3.30, fZ + 0.85], rx: 0.18, ry: 0.75 },
      { p: [fHipX - 0.30, fHipY + 2.20, fZ + 0.95], rx: 0.16, ry: 0.70 }
    ], 10, 16, sareeBlouseMat);
    femaleGroup.add(palluLoft);

    const fNeck = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.40, 0.65, 12), femaleSkinMat);
    fNeck.position.set(fHipX + 0.20, fHipY + 4.15, fZ);
    femaleGroup.add(fNeck);

    const femaleHead = buildRealisticSculptedHead({
      skinMat: femaleSkinMat,
      hairMat: hairMat,
      radius: 0.90,
      mustache: false,
      bindi: true,
      isFemale: true,
      lipMat: lipMat
    });
    femaleHead.position.set(fHipX + 0.25, fHipY + 5.05, fZ);
    femaleGroup.add(femaleHead);

    // FLOWING AUTHENTIC SAREE AANCHAL / GHOMTA (VEIL)
    // Draped over top and sides of head, framing face, cascading down back
    const veilHoodGeo = new THREE.SphereGeometry(1.06, 26, 20, -Math.PI * 0.46, Math.PI * 1.92, 0, Math.PI * 0.68);
    const veilHood = new THREE.Mesh(veilHoodGeo, sareeBlouseMat);
    veilHood.position.set(fHipX + 0.22, fHipY + 5.10, fZ);
    veilHood.castShadow = true;
    femaleGroup.add(veilHood);

    // Embroidered Crimson Trim Border Framing the Face
    const veilRimGeo = new THREE.TorusGeometry(1.07, 0.075, 8, 28, Math.PI * 0.96);
    const veilRim = new THREE.Mesh(veilRimGeo, sareeTrimRedMat);
    veilRim.position.set(fHipX + 0.38, fHipY + 5.10, fZ);
    veilRim.rotation.y = Math.PI / 2;
    femaleGroup.add(veilRim);

    // Flowing Veil Cascade down back onto seat
    const backVeilCascade = createSeamlessLoftedLimb([
      { p: [fHipX - 0.45, fHipY + 4.90, fZ], rx: 0.35, ry: 1.15 },
      { p: [fHipX - 0.75, fHipY + 3.50, fZ], rx: 0.40, ry: 1.25 },
      { p: [fHipX - 0.85, fHipY + 2.00, fZ], rx: 0.42, ry: 1.35 }
    ], 10, 12, sareeBlouseMat);
    femaleGroup.add(backVeilCascade);

    // Arms with Stacked Golden & Colored Bangles (Churi) & Graceful Hands
    [-1.25, 1.25].forEach(az => {
      const shPt = [fHipX + 0.20, fHipY + 3.30, fZ + az];
      const lapTarget = [-5.5, fHipY + 0.35, fZ + az * 0.35];
      const elbowPt = [-6.9, fHipY + 1.45, fZ + az * 1.05];

      // Saree Blouse Half-Sleeve with Gold Lace Trim
      femaleGroup.add(createBoneSegment(shPt, elbowPt, 0.48, 0.40, sareeBlouseMat));

      const sleeveGoldHem = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.045, 8, 16), goldTrimMat);
      sleeveGoldHem.position.set(elbowPt[0], elbowPt[1], elbowPt[2]);
      femaleGroup.add(sleeveGoldHem);

      // Bare Forearm
      femaleGroup.add(createBoneSegment(elbowPt, lapTarget, 0.36, 0.28, femaleSkinMat));

      // Stacked Traditional Bangles (Churi) on Wrists
      const bangleColors = [0xf59e0b, 0xdc2626, 0x16a34a, 0xf59e0b];
      bangleColors.forEach((bColor, bIdx) => {
        const bMat = new THREE.MeshStandardMaterial({ color: bColor, roughness: 0.25, metalness: 0.6 });
        const bangle = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.042, 8, 16), bMat);
        bangle.position.set(lapTarget[0] - 0.28 + bIdx * 0.09, lapTarget[1] + 0.08, lapTarget[2]);
        bangle.rotation.y = Math.PI / 2;
        femaleGroup.add(bangle);
      });

      // Realistic Delicate Resting Hand
      const fHand = buildRestingHand(femaleSkinMat, true);
      fHand.position.set(lapTarget[0], lapTarget[1], lapTarget[2]);
      fHand.rotation.y = az > 0 ? 0.3 : -0.3;
      femaleGroup.add(fHand);
    });

    // Flowing Draped Saree Skirt Covering Thighs & Knees
    [-0.95, 0.95].forEach(tz => {
      const legZ = fZ + tz;
      const hipPt = [fHipX, fHipY, legZ];
      const kneePt = [-5.5, fHipY, legZ];
      const anklePt = [-5.3, 5.65, legZ];

      femaleGroup.add(createBoneSegment(hipPt, kneePt, 0.68, 0.58, sareeSkirtMat));
      femaleGroup.add(createBoneSegment(kneePt, anklePt, 0.58, 0.48, sareeSkirtMat));

      const sandal = new THREE.Mesh(new THREE.BoxGeometry(1.55, 0.20, 0.70), brownSandalMat);
      sandal.position.set(anklePt[0] + 0.4, 5.45, legZ);
      femaleGroup.add(sandal);
    });

    // Cascading Saree Lap Fabric & Vertical Front Pleats (Kuchi)
    const skirtLapLoft = createSeamlessLoftedLimb([
      { p: [fHipX, fHipY + 0.35, fZ], rx: 0.65, ry: 1.15 },
      { p: [fHipX + 1.80, fHipY + 0.30, fZ], rx: 0.60, ry: 1.25 },
      { p: [-5.45, fHipY + 0.25, fZ], rx: 0.55, ry: 1.30 }
    ], 12, 12, sareeSkirtMat);
    femaleGroup.add(skirtLapLoft);

    // Cascading Pleats (Kuchi) Falling Straight Down to Footboard
    const kuchiLoft = createSeamlessLoftedLimb([
      { p: [-5.40, fHipY + 0.20, fZ], rx: 0.55, ry: 1.25 },
      { p: [-5.40, fHipY - 1.50, fZ], rx: 0.58, ry: 1.30 },
      { p: [-5.35, 5.65, fZ], rx: 0.62, ry: 1.35 }
    ], 12, 12, sareeSkirtMat);
    femaleGroup.add(kuchiLoft);

    // Broad Golden Hem Border along Bottom of Saree
    const skirtGoldHem = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.28, 2.85), goldTrimMat);
    skirtGoldHem.position.set(-5.35, 5.65, fZ);
    femaleGroup.add(skirtGoldHem);

    group.add(femaleGroup);

    return group;
  }

  const rickshaw = buildMasterRickshaw();
  scene.add(rickshaw);

  let clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const elapsed = clock.getElapsedTime();
    const speed = 2.4;
    const phase = elapsed * speed;

    if (rickshaw.userData.updatePedaling) {
      rickshaw.userData.updatePedaling(phase);
    }
    if (rickshaw.userData.wheels) {
      rickshaw.userData.wheels.forEach(w => {
        w.rotation.z = phase * 0.8;
      });
    }

    renderer.render(scene, camera);
  }
  animate();
</script>
