<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <title>Prod Rickshaw Render Test</title>
  <style>
    body { margin: 0; background: #0f172a; overflow: hidden; }
    canvas { width: 100vw; height: 100vh; display: block; }
  </style>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'></script>
</head>
<body>
  <div id='webgl-container'></div>
  <script src='../assets/crossroads-3d.js'></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0e17);
    const camera = new THREE.PerspectiveCamera(40, 1280 / 800, 0.1, 1000);
    camera.position.set(0.5, 6.2, 17.5);
    camera.lookAt(0.5, 5.8, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setSize(1280, 800);
    renderer.setPixelRatio(1.5);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.getElementById('webgl-container').appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xffffff, 0x334155, 1.1);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xfff7ed, 1.4);
    dir.position.set(12, 22, 15);
    scene.add(dir);
    const fill = new THREE.DirectionalLight(0x93c5fd, 0.7);
    fill.position.set(-15, 10, -10);
    scene.add(fill);

    const rickshaw = createRealisticDhakaRickshaw(0x0284c7, 101, {});
    scene.add(rickshaw);

    renderer.render(scene, camera);
    window.__RENDER_DONE__ = true;
  </script>
</body>
</html>
