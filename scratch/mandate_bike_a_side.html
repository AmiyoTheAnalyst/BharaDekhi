<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mandate Biker & Mudguards Verification</title>
  <style>
    body { margin: 0; background: #0c1220; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <script src="../assets/three.min.js"></script>
  <script>
    // Cached Textures
    let _cachedSidewallTexture = null;
    function getSportTireSidewallTexture() {
      if (_cachedSidewallTexture) return _cachedSidewallTexture;
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#16181b';
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = '#22252a';
      ctx.lineWidth = 14;
      ctx.beginPath();
      ctx.arc(256, 256, 240, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.arc(256, 256, 218, -Math.PI * 0.42, -Math.PI * 0.08);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(256, 256, 218, Math.PI * 0.58, Math.PI * 0.92);
      ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.save();
      ctx.translate(256, 256);
      ctx.rotate(-Math.PI * 0.25);
      ctx.fillText('DIABLO ROSSO', 0, -188);
      ctx.restore();

      ctx.save();
      ctx.translate(256, 256);
      ctx.rotate(Math.PI * 0.75);
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('200/55 ZR17', 0, -188);
      ctx.restore();

      ctx.strokeStyle = '#2a2d32';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(256, 256, 160, 0, Math.PI * 2);
      ctx.stroke();

      _cachedSidewallTexture = new THREE.CanvasTexture(canvas);
      _cachedSidewallTexture.wrapS = THREE.ClampToEdgeWrapping;
      _cachedSidewallTexture.wrapT = THREE.ClampToEdgeWrapping;
      return _cachedSidewallTexture;
    }

    let _cachedRotorTexture = null;
    function getDiscRotorTexture() {
      if (_cachedRotorTexture) return _cachedRotorTexture;
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 256, 256);

      ctx.fillStyle = '#cbd5e1';
      ctx.beginPath();
      ctx.arc(128, 128, 120, 0, Math.PI * 2);
      ctx.arc(128, 128, 68, 0, Math.PI * 2, true);
      ctx.fill();

      ctx.fillStyle = '#1e293b';
      for (let r = 80; r <= 112; r += 9) {
        const count = Math.floor(r * 0.45);
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 + (r * 0.1);
          const x = 128 + Math.cos(angle) * r;
          const y = 128 + Math.sin(angle) * r;
          ctx.beginPath();
          ctx.arc(x, y, 2.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      _cachedRotorTexture = new THREE.CanvasTexture(canvas);
      return _cachedRotorTexture;
    }

    // Shared Materials
    const rubberMat = new THREE.MeshStandardMaterial({ color: 0x16181b, roughness: 0.90 });
    const darkFrameMat = new THREE.MeshStandardMaterial({ color: 0x181a1d, roughness: 0.45, metalness: 0.50 });
    const chromeMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.22, metalness: 0.82 });
    const gunmetalEngineMat = new THREE.MeshStandardMaterial({ color: 0x22252a, roughness: 0.38, metalness: 0.65 });
    const bronzeCoverMat = new THREE.MeshStandardMaterial({ color: 0x78563a, roughness: 0.30, metalness: 0.60 });
    const goldAnodizedMat = new THREE.MeshStandardMaterial({ color: 0xd4a024, roughness: 0.22, metalness: 0.82 });
    const darkLeatherMat = new THREE.MeshStandardMaterial({ color: 0x141619, roughness: 0.80, metalness: 0.05 });
    const discRotorMat = new THREE.MeshStandardMaterial({ map: getDiscRotorTexture(), roughness: 0.25, metalness: 0.85, transparent: true });

    const pearlWhiteMat = new THREE.MeshStandardMaterial({ color: 0xf5f6fa, roughness: 0.18, metalness: 0.15, side: THREE.DoubleSide });
    const matteBlackKneeMat = new THREE.MeshStandardMaterial({ color: 0x1e2124, roughness: 0.85 });
    const smokedVisorMat = new THREE.MeshStandardMaterial({ color: 0x0a0f1d, roughness: 0.10, metalness: 0.20, transparent: true, opacity: 0.80 });

    const glossyBlackMat = new THREE.MeshStandardMaterial({ color: 0x0c0e12, roughness: 0.15, metalness: 0.30, side: THREE.DoubleSide });
    const crimsonPinstripeMat = new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.35, metalness: 0.20 });
    const redRimStripeMat = new THREE.MeshStandardMaterial({ color: 0xd63031, roughness: 0.30, metalness: 0.10 });

    // Lofting along X axis for fuel tank, seat, and fenders
    function createLoftedBodyMesh(stations, radSegs, mat) {
      radSegs = radSegs || 24;
      const numStations = stations.length;
      const pos = [];
      const uvs = [];
      const indices = [];

      for (let s = 0; s < numStations; s++) {
        const st = stations[s];
        const u = s / (numStations - 1);
        const ryTop = st.ryTop !== undefined ? st.ryTop : (st.ry !== undefined ? st.ry : 1.0);
        const ryBot = st.ryBot !== undefined ? st.ryBot : (st.ry !== undefined ? st.ry : 1.0);
        const rz = st.rz !== undefined ? st.rz : 1.0;

        for (let j = 0; j <= radSegs; j++) {
          const theta = (j / radSegs) * Math.PI * 2;
          const cosT = Math.cos(theta);
          const sinT = Math.sin(theta);
          const ry = cosT >= 0 ? ryTop : ryBot;
          const y = st.center[1] + cosT * ry;
          const z = st.center[2] + sinT * rz;
          const x = st.center[0];

          pos.push(x, y, z);
          uvs.push(j / radSegs, u);
        }
      }

      for (let s = 0; s < numStations - 1; s++) {
        for (let j = 0; j < radSegs; j++) {
          const a = s * (radSegs + 1) + j;
          const b = (s + 1) * (radSegs + 1) + j;
          const c = (s + 1) * (radSegs + 1) + j + 1;
          const d = s * (radSegs + 1) + j + 1;
          indices.push(a, b, d);
          indices.push(b, c, d);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // Explicit Upper-Arch Mudguard Generator with Smooth Normals (y = cy + sin(angle) * r, y > axleY)
    function createUpperArchFender(cx, cy, r, width, startDeg, endDeg, segs, mat, crownDrop) {
      segs = segs || 24;
      crownDrop = crownDrop !== undefined ? crownDrop : 0.08;
      const geo = new THREE.BufferGeometry();
      const pos = [];
      const uvs = [];
      const indices = [];
      const halfW = width / 2;

      for (let i = 0; i <= segs; i++) {
        const t = i / segs;
        const deg = startDeg + t * (endDeg - startDeg);
        const rad = deg * Math.PI / 180;
        const cosR = Math.cos(rad);
        const sinR = Math.sin(rad);

        // Center crown point (higher)
        const xC = cx + cosR * r;
        const yC = cy + sinR * r;
        // Edge points (dropped by crownDrop for curved cross section)
        const xE = cx + cosR * (r - crownDrop);
        const yE = cy + sinR * (r - crownDrop);

        pos.push(xE, yE, -halfW); // 0
        uvs.push(0, t);
        pos.push(xC, yC, 0);      // 1
        uvs.push(0.5, t);
        pos.push(xE, yE, halfW);  // 2
        uvs.push(1, t);
      }

      for (let i = 0; i < segs; i++) {
        const r0 = i * 3;
        const r1 = (i + 1) * 3;
        indices.push(r0, r1, r0 + 1);
        indices.push(r0 + 1, r1, r1 + 1);
        indices.push(r0 + 1, r1 + 1, r0 + 2);
        indices.push(r0 + 2, r1 + 1, r1 + 2);
      }

      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      return mesh;
    }

    function createSportWheel(radius, width, isRear, isModelA) {
      const wheel = new THREE.Group();
      const rimRadius = radius * 0.70;

      const tire = new THREE.Mesh(new THREE.TorusGeometry(radius - width * 0.42, width * 0.42, 18, 36), rubberMat);
      wheel.add(tire);

      if (isModelA) {
        [-1, 1].forEach(side => {
          const sidewallGeo = new THREE.RingGeometry(rimRadius * 0.98, radius * 0.98, 32);
          const sidewallMat = new THREE.MeshBasicMaterial({ map: getSportTireSidewallTexture(), transparent: true, side: THREE.DoubleSide });
          const sidewall = new THREE.Mesh(sidewallGeo, sidewallMat);
          sidewall.position.z = side * (width * 0.43);
          wheel.add(sidewall);
        });
      } else {
        [-1, 1].forEach(side => {
          const rimStripe = new THREE.Mesh(new THREE.TorusGeometry(rimRadius + 0.08, 0.07, 8, 36), redRimStripeMat);
          rimStripe.position.z = side * (width * 0.38);
          wheel.add(rimStripe);
        });
      }

      // Clean dark billet hub (ZERO stray tan block)
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(radius * 0.25, radius * 0.25, width * 0.85, 18), darkFrameMat);
      hub.rotation.x = Math.PI / 2;
      wheel.add(hub);

      for (let i = 0; i < 5; i++) {
        const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.32, rimRadius * 0.92, width * 0.32), darkFrameMat);
        spoke.rotation.z = (i / 5) * Math.PI * 2;
        spoke.position.set(Math.sin((i / 5) * Math.PI * 2) * (rimRadius * 0.46), Math.cos((i / 5) * Math.PI * 2) * (rimRadius * 0.46), 0);
        wheel.add(spoke);
      }

      const disc = new THREE.Mesh(new THREE.RingGeometry(radius * 0.24, radius * 0.62, 32), discRotorMat);
      disc.position.z = isRear ? -width * 0.36 : width * 0.36;
      wheel.add(disc);

      return wheel;
    }

    // =========================================================================
    // TASK 2: REBUILD REALISTIC FURNISHED 3D BIKER (BROAD UPPER BACK & SEAMLESS LIMBS)
    // =========================================================================
    function buildRealisticBiker(isCruiser, saddlePos, gripLeft, gripRight, pegLeft, pegRight) {
      const biker = new THREE.Group();

      const jacketColor = 0x1c2026; // Textured dark biker jacket (#1c2026)
      const vestColor = 0x13161b;   // Dark tactical vest panel
      const pantsColor = isCruiser ? 0x1e242b : 0x283c5a; // Tactical cargo / Dark denim
      const bootColor = 0x111317;   // Laced black combat/riding boots
      const gloveColor = 0x14161a;
      const helmetColor = isCruiser ? 0x121417 : 0x181c24;
      const visorColor = 0x050811;

      const jacketMat = new THREE.MeshStandardMaterial({ color: jacketColor, roughness: 0.65, metalness: 0.08 });
      const vestMat = new THREE.MeshStandardMaterial({ color: vestColor, roughness: 0.75, metalness: 0.05 });
      const pantsMat = new THREE.MeshStandardMaterial({ color: pantsColor, roughness: 0.82, metalness: 0.04 });
      const bootMat = new THREE.MeshStandardMaterial({ color: bootColor, roughness: 0.55, metalness: 0.12 });
      const soleMat = new THREE.MeshStandardMaterial({ color: 0x0a0b0e, roughness: 0.92 });
      const gloveMat = new THREE.MeshStandardMaterial({ color: gloveColor, roughness: 0.60, metalness: 0.15 });
      const collarMat = new THREE.MeshStandardMaterial({ color: 0x16181d, roughness: 0.88 });
      const helmetMat = new THREE.MeshStandardMaterial({ color: helmetColor, roughness: isCruiser ? 0.82 : 0.22, metalness: 0.30 });
      const visorMat = new THREE.MeshStandardMaterial({ color: visorColor, roughness: 0.04, metalness: 0.96 });

      const leanAngle = isCruiser ? -0.22 : -0.46; // Radians

      // 1. CONNECTED PELVIS & GLUTES SEATED SQUARELY ON SADDLE (ZERO GAP BEHIND RIDER)
      // Glutes sit directly inside saddle pocket, filling seat width completely
      const pelvisGroup = new THREE.Group();
      const glutesY = saddlePos[1] + 0.15;
      pelvisGroup.position.set(saddlePos[0], glutesY, saddlePos[2]);

      // Broad anatomical glutes & pelvis hip block (widthZ = 2.15, filling saddle completely)
      const glutesMesh = new THREE.Mesh(new THREE.SphereGeometry(1.05, 24, 18), pantsMat);
      glutesMesh.scale.set(1.30, 0.75, 1.05); // Radius Z = 1.05 -> Width = 2.10
      pelvisGroup.add(glutesMesh);

      // Lumbar rise & waist bridge filling seat backrest seam
      const lumbarMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.85, 1.05, 0.95, 20), pantsMat);
      lumbarMesh.position.set(-0.25, 0.40, 0);
      lumbarMesh.rotation.z = isCruiser ? -0.12 : -0.28;
      pelvisGroup.add(lumbarMesh);

      // Wide dark tactical belt at jacket seam
      const belt = new THREE.Mesh(new THREE.CylinderGeometry(0.92, 0.92, 0.28, 20), new THREE.MeshStandardMaterial({ color: 0x0d0e12, roughness: 0.6 }));
      belt.position.set(-0.15, 0.72, 0);
      belt.rotation.z = leanAngle;
      pelvisGroup.add(belt);

      biker.add(pelvisGroup);

      // 2. BROAD ANATOMICAL UPPER BACK, CHEST & INTEGRATED SHOULDERS (NO BOWLING PIN!)
      // Built out of 3 overlapping anatomical sections:
      const torsoGroup = new THREE.Group();
      torsoGroup.position.set(saddlePos[0] + 0.05, glutesY + 0.60, saddlePos[2]);
      torsoGroup.rotation.z = leanAngle;

      // Section 1: Contoured Mid-Torso / Ribcage (tapering naturally from widthZ = 2.0 under arms down to 1.55 at waist)
      const ribcage = new THREE.Mesh(new THREE.CylinderGeometry(0.98, 0.78, 1.9, 24), jacketMat);
      ribcage.scale.set(0.92, 1.0, 1.0); // Depth X = 0.90, Width Z tapers from 1.96 down to 1.56
      ribcage.position.set(0, 0.95, 0);
      torsoGroup.add(ribcage);

      // Front tactical vest panel & rear spine protector
      const vestPanel = new THREE.Mesh(new THREE.BoxGeometry(0.35, 1.7, 1.45), vestMat);
      vestPanel.position.set(0.55, 1.05, 0);
      torsoGroup.add(vestPanel);

      const spinePanel = new THREE.Mesh(new THREE.BoxGeometry(0.30, 1.8, 1.25), vestMat);
      spinePanel.position.set(-0.52, 1.0, 0);
      torsoGroup.add(spinePanel);

      // Section 2: Broad Upper Chest & Scapula/Shoulder Yoke
      // Wide muscular horizontal ellipsoid across upper back and chest: widthZ = 2.2, heightY = 1.1, depthX = 1.15
      const shoulderYoke = new THREE.Mesh(new THREE.SphereGeometry(1.0, 32, 24), jacketMat);
      shoulderYoke.scale.set(1.15 / 2, 1.10 / 2, 2.20 / 2); // Radius: X = 0.575, Y = 0.55, Z = 1.10 (widthZ = 2.20)
      shoulderYoke.position.set(0, 1.95, 0);
      torsoGroup.add(shoulderYoke);

      // Section 3: Thick Folded Hoodie Collar & Neck Seal (ZERO gap under helmet)
      const hoodieCollar = new THREE.Mesh(new THREE.TorusGeometry(0.65, 0.26, 16, 28), collarMat);
      hoodieCollar.rotation.x = Math.PI / 2;
      hoodieCollar.position.set(0, 2.35, 0);
      torsoGroup.add(hoodieCollar);

      const neckSeal = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.54, 0.60, 20), collarMat);
      neckSeal.position.set(0, 2.55, 0);
      torsoGroup.add(neckSeal);

      biker.add(torsoGroup);

      // 3. SEAMLESS TAPERED ARMS EMBEDDED INSIDE SHOULDER YOKE (NO FLOATING CYLINDERS, NO BALL JOINTS)
      // Shoulder origins: local (0, 1.95, ±0.95) strictly INSIDE the wide shoulder yoke (radiusZ = 1.10)
      const shLocalL = new THREE.Vector3(0.0, 1.95, -0.95);
      const shLocalR = new THREE.Vector3(0.0, 1.95, 0.95);
      shLocalL.applyEuler(new THREE.Euler(0, 0, leanAngle)).add(torsoGroup.position);
      shLocalR.applyEuler(new THREE.Euler(0, 0, leanAngle)).add(torsoGroup.position);

      [[-1, shLocalL, gripLeft], [1, shLocalR, gripRight]].forEach(([side, shPos, gripPos]) => {
        const sx = shPos.x;
        const sy = shPos.y;
        const sz = shPos.z;
        const gx = gripPos[0];
        const gy = gripPos[1];
        const gz = gripPos[2];

        // Natural elbow point with realistic bend, dropped slightly toward tank
        const elbowX = sx + (gx - sx) * 0.42 - 0.25;
        const elbowY = sy + (gy - sy) * 0.45 - 0.55;
        const elbowZ = sz + (gz - sz) * 0.38 + side * 0.15;

        const wristX = gx - 0.18;
        const wristY = gy - 0.08;
        const wristZ = gz;

        // Continuous smooth curved spline arm (shoulder -> bicep -> elbow bend -> forearm -> wrist)
        const armCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(sx, sy, sz),
          new THREE.Vector3(sx + (elbowX - sx) * 0.5, sy + (elbowY - sy) * 0.5, sz + (elbowZ - sz) * 0.5),
          new THREE.Vector3(elbowX, elbowY, elbowZ),
          new THREE.Vector3(elbowX + (wristX - elbowX) * 0.5, elbowY + (wristY - elbowY) * 0.5, elbowZ + (wristZ - elbowZ) * 0.5),
          new THREE.Vector3(wristX, wristY, wristZ)
        ]);

        // Seamless tapered arm mesh (radius: 0.36 shoulder to 0.26 forearm to 0.20 wrist)
        const armTube = new THREE.Mesh(new THREE.TubeGeometry(armCurve, 20, 0.30, 14, false), jacketMat);
        biker.add(armTube);

        // Dark Motorcycle Riding Glove gripping handlebar
        const handGroup = new THREE.Group();
        handGroup.position.set(gx, gy, gz);

        const palm = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.36, 0.42), gloveMat);
        handGroup.add(palm);

        const fingers = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.40, 14), gloveMat);
        fingers.rotation.x = Math.PI / 2;
        fingers.position.set(0.15, -0.06, 0);
        handGroup.add(fingers);

        const lever = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.90, 8), chromeMat);
        lever.rotation.x = Math.PI / 2 + (side * 0.12);
        lever.position.set(0.32, 0.04, -side * 0.22);
        handGroup.add(lever);

        biker.add(handGroup);
      });

      // 4. CONNECTED TROUSERS, KNEES, CALVES & LACED COMBAT BOOTS
      [[-1, pegLeft], [1, pegRight]].forEach(([side, pegPos]) => {
        const hipX = saddlePos[0] + 0.30;
        const hipY = glutesY + 0.10;
        const hipZ = side * 0.85;

        const px = pegPos[0];
        const py = pegPos[1];
        const pz = pegPos[2];

        // Knee hugging fuel tank tightly
        let kneeX, kneeY, kneeZ;
        if (isCruiser) {
          kneeX = hipX + 1.85;
          kneeY = hipY - 0.20;
          kneeZ = side * 1.15;
        } else {
          kneeX = hipX + 1.65;
          kneeY = hipY - 0.38;
          kneeZ = side * 1.15;
        }

        const ankleX = px;
        const ankleY = py + 0.45;
        const ankleZ = pz;

        // Continuous smooth curved leg spline (hip -> thigh -> knee -> calf -> ankle)
        const legCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(hipX, hipY, hipZ),
          new THREE.Vector3(hipX + (kneeX - hipX) * 0.5, hipY + (kneeY - hipY) * 0.5, hipZ + (kneeZ - hipZ) * 0.5),
          new THREE.Vector3(kneeX, kneeY, kneeZ),
          new THREE.Vector3(kneeX + (ankleX - kneeX) * 0.5, kneeY + (ankleY - kneeY) * 0.5, kneeZ + (ankleZ - kneeZ) * 0.5),
          new THREE.Vector3(ankleX, ankleY, ankleZ)
        ]);
        const legTube = new THREE.Mesh(new THREE.TubeGeometry(legCurve, 20, 0.38, 14, false), pantsMat);
        biker.add(legTube);

        // Dark molded knee armor contour
        const kneePad = new THREE.Mesh(new THREE.SphereGeometry(0.35, 14, 10), gloveMat);
        kneePad.scale.set(0.48, 0.88, 0.78);
        kneePad.position.set(kneeX + 0.20, kneeY, kneeZ);
        biker.add(kneePad);

        // Laced Black Leather Combat/Riding Boot on Footpeg
        const bootGroup = new THREE.Group();
        bootGroup.position.set(px, py, pz);
        if (isCruiser) bootGroup.rotation.z = 0.25;

        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.26, 0.65, 14), bootMat);
        shaft.position.set(0, 0.32, 0);
        bootGroup.add(shaft);

        const sole = new THREE.Mesh(new THREE.BoxGeometry(1.65, 0.18, 0.68), soleMat);
        sole.position.set(0.30, 0.09, 0);
        bootGroup.add(sole);

        const upper = new THREE.Mesh(new THREE.BoxGeometry(1.10, 0.42, 0.64), bootMat);
        upper.position.set(0.12, 0.32, 0);
        bootGroup.add(upper);

        const toe = new THREE.Mesh(new THREE.BoxGeometry(0.60, 0.32, 0.62), bootMat);
        toe.position.set(0.68, 0.25, 0);
        bootGroup.add(toe);

        biker.add(bootGroup);
      });

      // 5. REALISTIC PROPORTIONATE HEAD / HELMET (1.3X SCALE, FLUSH FIT IN HOODIE COLLAR)
      const headPosLocal = new THREE.Vector3(0, 2.75, 0);
      headPosLocal.applyEuler(new THREE.Euler(0, 0, leanAngle)).add(torsoGroup.position);

      const helmetGroup = new THREE.Group();
      helmetGroup.position.copy(headPosLocal);
      helmetGroup.rotation.z = isCruiser ? -0.06 : -0.16;

      // 1.3x Scale Helmet Shell (Proportionate ~ 1/2.4 of shoulder width, seated flush into collar)
      const helmetShell = new THREE.Mesh(new THREE.SphereGeometry(1.02, 32, 24), helmetMat);
      helmetShell.scale.set(1.18, 1.12, 1.02);
      helmetGroup.add(helmetShell);

      if (isCruiser) {
        // Black Cruiser: Matte-black biker helmet / dark balaclava hood with recessed visor
        const chinBar = new THREE.Mesh(new THREE.CylinderGeometry(0.98, 0.92, 0.48, 24, 1, false, -Math.PI * 0.34, Math.PI * 0.68), helmetMat);
        chinBar.scale.set(1.15, 1.0, 1.0);
        chinBar.position.set(0.18, -0.28, 0);
        helmetGroup.add(chinBar);

        const visor = new THREE.Mesh(new THREE.CylinderGeometry(1.02, 0.98, 0.50, 24, 1, true, -Math.PI * 0.34, Math.PI * 0.68), visorMat);
        visor.scale.set(1.16, 1.0, 1.0);
        visor.position.set(0.20, 0.10, 0);
        helmetGroup.add(visor);
      } else {
        // White Streetfighter: Sleek aerodynamic full-face sport helmet with dark tinted visor
        const chinBar = new THREE.Mesh(new THREE.CylinderGeometry(1.00, 0.94, 0.50, 24, 1, false, -Math.PI * 0.36, Math.PI * 0.72), helmetMat);
        chinBar.scale.set(1.16, 1.0, 1.0);
        chinBar.position.set(0.20, -0.30, 0);
        helmetGroup.add(chinBar);

        const visor = new THREE.Mesh(new THREE.CylinderGeometry(1.04, 1.00, 0.52, 24, 1, true, -Math.PI * 0.36, Math.PI * 0.72), visorMat);
        visor.scale.set(1.17, 1.0, 1.0);
        visor.position.set(0.22, 0.12, 0);

        vTwinGroup.add(cylGroup);

        const rockerHead = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.55, 1.6), chromeMat);
        rockerHead.rotation.z = va;
        rockerHead.position.set(Math.sin(va) * 2.8, Math.cos(va) * 2.8, 0);
        vTwinGroup.add(rockerHead);

        [-0.55, 0.55].forEach(pz => {
          const pushRod = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.2, 8), chromeMat);
          pushRod.rotation.z = va * 1.08;
          pushRod.position.set(Math.sin(va) * 1.35, Math.cos(va) * 1.35, pz * 1.05);
          vTwinGroup.add(pushRod);
        });
      });

      const airCleaner = new THREE.Mesh(new THREE.CylinderGeometry(0.72, 0.72, 0.32, 20), chromeMat);
      airCleaner.rotation.x = Math.PI / 2;
      airCleaner.position.set(0.0, 1.3, 1.32);
      vTwinGroup.add(airCleaner);

      const primaryCover = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 0.95, 0.35, 20), chromeMat);
      primaryCover.rotation.x = Math.PI / 2;
      primaryCover.position.set(0.2, -0.2, 1.25);
      vTwinGroup.add(primaryCover);
      bike.add(vTwinGroup);

      // Dual Staggered Chrome Exhaust Pipes
      [0.95, 1.30].forEach((pz, idx) => {
        const pipeY = 2.7 + idx * 0.45;
        const pipePts = [
          new THREE.Vector3(2.4, 4.4 - idx * 0.4, 0.6),
          new THREE.Vector3(3.0, 3.4, pz),
          new THREE.Vector3(1.8, pipeY, pz),
          new THREE.Vector3(-4.0, pipeY, pz),
          new THREE.Vector3(-8.8 - idx * 0.4, pipeY, pz)
        ];
        const pipeCurve = new THREE.CatmullRomCurve3(pipePts);
        const exPipe = new THREE.Mesh(new THREE.TubeGeometry(pipeCurve, 20, 0.22, 10, false), chromeMat);
        bike.add(exPipe);

        const slashTip = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.65, 14), chromeMat);
        slashTip.rotation.z = Math.PI / 2 - 0.35;
        slashTip.position.set(-8.8 - idx * 0.4, pipeY, pz);
        bike.add(slashTip);
      });

      // Teardrop Glossy Black Fuel Tank with Crimson Pinstripes
      const cruiserTankStations = [
        { center: [5.4, 7.5, 0],  ryTop: 0.50, ryBot: 0.65, rz: 0.65 },
        { center: [4.0, 8.4, 0],  ryTop: 1.20, ryBot: 1.45, rz: 1.40 },
        { center: [2.2, 8.2, 0],  ryTop: 1.15, ryBot: 1.35, rz: 1.30 },
        { center: [0.2, 7.3, 0],  ryTop: 0.90, ryBot: 1.10, rz: 1.05 },
        { center: [-1.4, 6.4, 0], ryTop: 0.50, ryBot: 0.65, rz: 0.72 }
      ];
      bike.add(createLoftedBodyMesh(cruiserTankStations, 24, glossyBlackMat));

      // Flush billet gas cap (ZERO vertical grey bar)
      const gasCap = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.10, 18), chromeMat);
      gasCap.position.set(3.2, 8.85, 0);
      gasCap.rotation.z = -0.25;
      bike.add(gasCap);

      [-1.38, 1.38].forEach(tz => {
        const pinstripeCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(-1.2, 6.5, tz * 0.7),
          new THREE.Vector3(0.4, 7.5, tz * 0.95),
          new THREE.Vector3(2.2, 8.6, tz * 1.05),
          new THREE.Vector3(4.0, 8.7, tz * 1.05),
          new THREE.Vector3(5.2, 7.7, tz * 0.6)
        ]);
        const stripeTube = new THREE.Mesh(new THREE.TubeGeometry(pinstripeCurve, 20, 0.05, 8, false), crimsonPinstripeMat);
        bike.add(stripeTube);
      });

      // Ultra-Low Scooped Leather Saddle & Sweeping Rear Fender (SEAMLESS CONTINUOUS BODYWORK)
      const seatStations = [
        { center: [-1.4, 6.4, 0], ryTop: 0.38, ryBot: 0.35, rz: 0.72 },
        { center: [-2.6, 5.8, 0], ryTop: 0.35, ryBot: 0.35, rz: 0.95 }, // Deepest pocket directly under rider
        { center: [-3.8, 6.3, 0], ryTop: 0.40, ryBot: 0.32, rz: 0.88 }, // Lumbar rise supporting rider's back
        { center: [-4.4, 6.1, 0], ryTop: 0.25, ryBot: 0.22, rz: 0.80 }  // Seamless junction into rear fender
      ];
      bike.add(createLoftedBodyMesh(seatStations, 20, darkLeatherMat));

      // 2. MODEL B REAR MUDGUARD: Sweeping Glossy Black Rear Fender from back of seat to bobbed tail
      // Hugging the top arch of the rear tire, flowing seamlessly into the saddle!
      const fenderStations = [
        { center: [-4.3, 6.08, 0], ryTop: 0.18, ryBot: 0.14, rz: 1.15 },
        { center: [-5.6, 6.35, 0], ryTop: 0.20, ryBot: 0.16, rz: 1.25 },
        { center: [-7.2, 6.55, 0], ryTop: 0.22, ryBot: 0.18, rz: 1.28 },
        { center: [-8.8, 6.50, 0], ryTop: 0.22, ryBot: 0.18, rz: 1.25 },
        { center: [-10.4, 5.75, 0], ryTop: 0.20, ryBot: 0.16, rz: 1.20 },
        { center: [-11.5, 4.40, 0], ryTop: 0.18, ryBot: 0.14, rz: 1.12 }
      ];
      bike.add(createLoftedBodyMesh(fenderStations, 24, glossyBlackMat));

      // Crimson Pinstripes along rear fender flanks
      [-1.18, 1.18].forEach(rz => {
        const rStripeCurve = new THREE.CatmullRomCurve3([
          new THREE.Vector3(-4.4, 6.12, rz * 0.75),
          new THREE.Vector3(-6.2, 6.42, rz * 0.95),
          new THREE.Vector3(-8.8, 6.56, rz * 0.98),
          new THREE.Vector3(-10.4, 5.82, rz * 0.95),
          new THREE.Vector3(-11.5, 4.45, rz * 0.80)
        ]);
        const rStripe = new THREE.Mesh(new THREE.TubeGeometry(rStripeCurve, 20, 0.05, 8, false), crimsonPinstripeMat);
        bike.add(rStripe);
      });

      // Chrome Tombstone Taillight on rear fender tip
      const tombstoneHl = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.65, 0.45), chromeMat);
      tombstoneHl.position.set(-11.5, 4.4, 0);
      tombstoneHl.rotation.z = -0.45;
      bike.add(tombstoneHl);

      const tombstoneLens = new THREE.Mesh(
        new THREE.BoxGeometry(0.12, 0.45, 0.35),
        new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xdc2626, emissiveIntensity: 1.0 })
      );
      tombstoneLens.position.set(-11.65, 4.45, 0);
      tombstoneLens.rotation.z = -0.45;
      bike.add(tombstoneLens);

      [-1.15, 1.15].forEach(sz => {
        const cArm = new THREE.Mesh(new THREE.BoxGeometry(7.4, 0.70, 0.38), darkFrameMat);
        cArm.position.set(-4.8, 3.4, sz);
        cArm.rotation.z = 0.08;
        bike.add(cArm);

        const strut = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.35, 0.22), chromeMat);
        strut.position.set(-6.8, 5.6, sz);
        strut.rotation.z = 0.18;
        bike.add(strut);
      });

      // Forward Footpegs
      const pegLeft = [2.8, 3.8, -1.55];
      const pegRight = [2.8, 3.8, 1.55];
      [-1, 1].forEach(side => {
        const peg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.85, 12), darkFrameMat);
        peg.rotation.x = Math.PI / 2;
        peg.position.set(2.8, 3.6, side * 1.55);
        bike.add(peg);
      });

      // ATTACH REBUILT FURNISHED BIKER (Cruiser Posture - Deeply nested in saddle)
      const saddlePos = [-2.6, 5.8, 0];
      const biker = buildRealisticBiker(true, saddlePos, gripLeft, gripRight, pegLeft, pegRight);
      bike.add(biker);

      return bike;
    }

    // Scene & Camera
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0c1220);
    const camera = new THREE.PerspectiveCamera(36, 1280 / 720, 0.1, 1000);
    camera.position.set(0, 6.5, 27); camera.lookAt(0, 5.5, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(1280, 720);
    renderer.setPixelRatio(1.5);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Studio Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.80);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
    keyLight.position.set(20, 30, 20);
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0x93c5fd, 1.1);
    rimLight.position.set(-20, 15, -20);
    scene.add(rimLight);

    const rearLight = new THREE.DirectionalLight(0xffffff, 1.0);
    rearLight.position.set(-25, 20, 25);
    scene.add(rearLight);

    const fillLight = new THREE.DirectionalLight(0xfef08a, 0.4);
    fillLight.position.set(0, -10, 20);
    scene.add(fillLight);

    // Ground Plane
    const groundGeo = new THREE.PlaneGeometry(100, 100);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.85, metalness: 0.1 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    scene.add(ground);

    const bike = buildStreetfighterModelA(); scene.add(bike);

    window.captureReady = false;
    let frames = 0;
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
      frames++;
      if (frames > 15) {
        window.captureReady = true;
      }
    }
    animate();
  </script>
</body>
</html>
