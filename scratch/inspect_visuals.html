<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>3D Inspection Studio</title>
  <script src="../assets/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    body { margin: 0; background: #0b0f19; overflow: hidden; font-family: sans-serif; color: #fff; }
    #hud { position: absolute; top: 12px; left: 12px; z-index: 10; background: rgba(15,23,42,0.9); padding: 10px 16px; border-radius: 8px; border: 1px solid #38bdf8; font-size: 14px; }
  </style>
</head>
<body>
<div id="hud">Target: <strong id="targetName">Loading...</strong></div>
<script src="../assets/crossroads-3d.js"></script>
<script>
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0f172a);

  // Ground plane
  const roadGeo = new THREE.PlaneGeometry(260, 260);
  const roadMat = new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.85 });
  const road = new THREE.Mesh(roadGeo, roadMat);
  road.rotation.x = -Math.PI / 2;
  scene.add(road);

  // Road markings
  const lineGeo = new THREE.PlaneGeometry(160, 0.4);
  const lineMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
  const line = new THREE.Mesh(lineGeo, lineMat);
  line.rotation.x = -Math.PI / 2;
  line.position.set(0, 0.02, 0);
  scene.add(line);

  const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 500);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  document.body.appendChild(renderer.domElement);

  const amb = new THREE.AmbientLight(0xffffff, 0.85);
  scene.add(amb);
  const sun = new THREE.DirectionalLight(0xfffaed, 1.5);
  sun.position.set(25, 45, 30);
  sun.castShadow = true;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0x93c5fd, 0.7);
  fill.position.set(-25, 20, -25);
  scene.add(fill);

  const urlParams = new URLSearchParams(window.location.search);
  const target = urlParams.get('target') || 'bus';
  const seed = parseInt(urlParams.get('seed') || '0', 10);
  const archetype = parseInt(urlParams.get('archetype') || '0', 10);
  const viewMode = urlParams.get('view') || 'side';
  document.getElementById('targetName').textContent = target.toUpperCase();

  const loader = new THREE.GLTFLoader();

  function onModelReady(currentMesh) {
    if (target === 'bike') {
      if (viewMode === 'head') {
        camera.position.set(12, 11, 8);
        camera.lookAt(0, 10.5, 0);
      } else if (viewMode === 'side') {
        camera.position.set(0, 8, 22);
        camera.lookAt(0, 5, 0);
      } else {
        camera.position.set(16, 12, 16);
        camera.lookAt(0, 5, 0);
      }
    } else if (target === 'bus') {
      if (viewMode === 'rear_wheels') {
        camera.position.set(-18, 6, -18);
        camera.lookAt(-14, 4, 0);
      } else if (viewMode === 'banner') {
        camera.position.set(2, 14, -22);
        camera.lookAt(2, 12, 0);
      } else {
        camera.position.set(0, 10, -52);
        camera.lookAt(0, 8, 0);
      }
    } else if (target === 'cng') {
      if (viewMode === 'front') {
        camera.position.set(18, 8, 12);
        camera.lookAt(0, 6, 0);
      } else {
        camera.position.set(0, 8, -26);
        camera.lookAt(0, 6, 0);
      }
    } else if (target === 'rickshaw') {
      if (viewMode === 'puller') {
        camera.position.set(10, 10, -14);
        camera.lookAt(2, 8, 0);
      } else {
        camera.position.set(0, 8, -24);
        camera.lookAt(0, 6, 0);
      }
    }

    let frame = 0;
    function renderLoop() {
      requestAnimationFrame(renderLoop);
      frame++;
      renderer.render(scene, camera);
      if (frame === 10) {
        window.__READY__ = true;
      }
    }
    renderLoop();
  }

  if (target === 'cng') {
    loader.load('../assets/models/cng-autorickshaw.glb', gltf => {
      const vehicle = new THREE.Group();
      scene.add(vehicle);
      window.replaceCNGWithModel(vehicle, gltf.scene);
      onModelReady(vehicle);
    });
  } else if (target === 'bus') {
    loader.load('../assets/models/dhaka-bus.glb', gltf => {
      const vehicle = new THREE.Group();
      scene.add(vehicle);
      window.replaceBusWithModel(vehicle, gltf.scene);
      onModelReady(vehicle);
    });
  } else if (target === 'rickshaw') {
    loader.load('../assets/models/cycle-rickshaw.glb', gltf => {
      const vehicle = new THREE.Group();
      scene.add(vehicle);
      window.replaceRickshawWithModel(vehicle, gltf.scene);
      onModelReady(vehicle);
    });
  } else if (target === 'bike') {
    const bike = window.create3DVehicle('bike', 0x2563eb, 'test_bike_' + seed, {
      type: 'bike',
      dir: 'EB',
      archetype: archetype,
      outfit: seed,
      palette: seed
    });
    onModelReady(bike);
  }
</script>
</body>
</html>
